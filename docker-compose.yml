# Self-host Cascade Cloud: `docker compose up` builds the image (Dockerfile)
# and starts the server with the web UI served from it, on one port.
#
# Quick start:
#   cp .env.example .env
#   # then set SESSION_SECRET (see .env.example for how to generate one)
#   docker compose up
#   # → http://localhost:8787
#
# All configuration is read from ./.env (see .env.example for every
# variable this server understands, straight from cloud/server/src/env.ts).

services:
  cascade-cloud:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # LOOPBACK ONLY by default. Host:container both default to PORT from .env
      # (8787 if unset), so this stays correct if you change PORT there.
      #
      # The 127.0.0.1 prefix is the important part, and it is deliberate: a
      # fresh self-host has no OAuth configured, so the documented way to get
      # in is CLOUD_DEV_BYPASS — which authenticates anyone who can reach the
      # port. Publishing on 0.0.0.0 by default would hand the whole LAN a
      # sign-in-as-anyone endpoint on the first `docker compose up`. Cascade
      # already binds its CLI dashboard to loopback for exactly this reason.
      #
      # To expose it deliberately: configure real OAuth (GITHUB_CLIENT_ID /
      # GOOGLE_CLIENT_ID in .env), turn CLOUD_DEV_BYPASS off, and only then
      # drop the 127.0.0.1 prefix or put a reverse proxy in front.
      - "127.0.0.1:${PORT:-8787}:${PORT:-8787}"
    env_file:
      - .env
    volumes:
      # Persists the SQLite DB + per-tenant uploads (DATA_DIR in .env.example
      # points here) across `docker compose down` / image rebuilds. Without
      # this, every restart starts from an empty database — see env.ts's own
      # comment on DATA_DIR for why that's treated as a data-loss bug.
      - cascade-data:/data
    restart: unless-stopped

volumes:
  cascade-data:
