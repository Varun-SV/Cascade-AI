<!doctype html><html><head><meta charset="utf-8"><title>Dine newsletter</title><link rel="stylesheet" href="style.css"><script src="done.js"></script></head><body>
<main><h1>Weekly picks</h1><p>New places, every Friday.</p><signup-box></signup-box></main>
<script>
customElements.define('signup-box', class extends HTMLElement {
  connectedCallback() {
    const root = this.attachShadow({ mode: 'open' });
    root.innerHTML = '<div style="border:1px solid #ddd;padding:12px;border-radius:8px"><input aria-label="Your email" placeholder="you@example.com"> <button>Subscribe</button></div>';
    root.querySelector('button').onclick = () => { if (root.querySelector('input').value.includes('@')) done('newsletter'); };
  }
});
</script></body></html>
