<title>Cascade Design Direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --paper:#F7F6F2; --side:#EFEDE7; --card:#FFFFFF; --sunk:#EAE8E1; --hover:rgba(21,23,28,.05);
  --ink:#15171C; --ink-2:#555A63; --ink-3:#868B94; --line:rgba(21,23,28,.10); --line-2:rgba(21,23,28,.17);
  --accent:#2F6FE4; --accent-ink:#FFFFFF; --accent-soft:rgba(47,111,228,.10);
  --t1:#2F6FE4; --t2:#1C8FBE; --t3:#0E9B89;
  --ramp:linear-gradient(180deg,#4C8DFF,#38B0DE 50%,#2DD4BF);
  --ramp-x:linear-gradient(90deg,#4C8DFF,#38B0DE 50%,#2DD4BF);
  --save:#0E8A7A; --warn:#A8671A; --bad:#B8322A;
  --user:#E9E7E0; --btn:#15171C; --btn-ink:#F7F6F2;
  --shadow:0 1px 2px rgba(21,23,28,.05),0 10px 30px rgba(21,23,28,.07);
  --shadow-lg:0 24px 60px rgba(21,23,28,.16);
  --f-ui:"Geist","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"Geist Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px; --r-lg:16px; --r-xl:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1117; --side:#0A0D12; --card:#161A22; --sunk:#1B2029; --hover:rgba(233,235,240,.05);
  --ink:#E9EBF0; --ink-2:#A2A8B4; --ink-3:#6E7583; --line:rgba(233,235,240,.08); --line-2:rgba(233,235,240,.15);
  --accent:#6FA3FF; --accent-ink:#0E1117; --accent-soft:rgba(111,163,255,.14);
  --t1:#6FA3FF; --t2:#4CC3EC; --t3:#3EDFC9; --save:#3EDFC9; --warn:#E6B25C; --bad:#F08A80;
  --user:#1B2029; --btn:#E9EBF0; --btn-ink:#0E1117;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0E1117; --side:#0A0D12; --card:#161A22; --sunk:#1B2029; --hover:rgba(233,235,240,.05);
  --ink:#E9EBF0; --ink-2:#A2A8B4; --ink-3:#6E7583; --line:rgba(233,235,240,.08); --line-2:rgba(233,235,240,.15);
  --accent:#6FA3FF; --accent-ink:#0E1117; --accent-soft:rgba(111,163,255,.14);
  --t1:#6FA3FF; --t2:#4CC3EC; --t3:#3EDFC9; --save:#3EDFC9; --warn:#E6B25C; --bad:#F08A80;
  --user:#1B2029; --btn:#E9EBF0; --btn-ink:#0E1117;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:17px;height:17px;flex:none;display:inline-block;vertical-align:middle}
.ic-sm{width:14px;height:14px}
.mono{font-family:var(--f-mono)}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.no-motion *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes fade{from{opacity:0}}
@keyframes flow{from{background-position:0 0}to{background-position:0 -200%}}
@keyframes arc{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

/* mark */
.mark path{fill:none;stroke-width:2.1;stroke-linecap:round}
.mark .a1{stroke:var(--t1)}.mark .a2{stroke:var(--t2)}.mark .a3{stroke:var(--t3)}
.mark.busy path{animation:arc 1.2s ease-in-out infinite}
.mark.busy .a2{animation-delay:.18s}.mark.busy .a3{animation-delay:.36s}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 16px;border:0;border-radius:var(--r);background:var(--btn);color:var(--btn-ink);font-weight:500;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost:hover{background:var(--hover)}
.btn.quiet{background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--hover);color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{height:30px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.lg{height:44px;padding:0 20px;font-size:15px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib.sm{width:26px;height:26px}
.ib:disabled{opacity:.35;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:0;box-shadow:inset 0 0 0 1px var(--line-2);background:transparent;color:var(--ink-2);font-size:13px;white-space:nowrap}
.chip:hover{color:var(--ink);background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--accent-soft);box-shadow:none;color:var(--accent)}
.chip .x{display:inline-flex;border:0;background:none;padding:0;color:inherit;opacity:.7}
.field{width:100%;height:38px;border:0;box-shadow:inset 0 0 0 1px var(--line-2);background:var(--card);border-radius:var(--r);padding:0 12px;outline:none;color:var(--ink)}
textarea.field{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
.field:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--sunk)}
.seg button{border:0;background:transparent;color:var(--ink-2);font-size:13px;font-weight:500;padding:4px 11px;border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.switch{position:relative;width:36px;height:21px;border-radius:99px;border:0;background:var(--line-2);flex:none;transition:background .2s;padding:0}
.switch::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(15px)}
.label{font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:.02em}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.d1{background:var(--t1)}.d2{background:var(--t2)}.d3{background:var(--t3)}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:5px;background:var(--sunk);color:var(--ink-2)}
kbd{font-family:var(--f-mono);font-size:11px;padding:1px 5px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink-3)}

/* ============ TOP STRIP ============ */
.strip{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.strip b{font-weight:600}
.strip .note{font-size:12px;color:var(--ink-3)}
@media (max-width:640px){.strip .note{display:none}}
.stage{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:hidden;display:flex}
.scrollview{overflow-y:auto;display:block}

/* ============ APP ============ */
.side{width:260px;flex:none;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--line);padding:12px 10px;gap:2px;min-height:0;transition:margin .22s ease;z-index:20}
.side.closed{margin-left:-260px}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 12px}
.brand b{font-family:var(--f-read);font-size:20px;font-weight:500;letter-spacing:-.01em;flex:1}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--ink);padding:7px 10px;border-radius:8px;text-align:left}
.nav:hover{background:var(--hover)}
.nav .ic{color:var(--ink-2)}
.side .label{padding:18px 10px 6px}
.side-search{display:flex;align-items:center;gap:8px;margin:2px 0;padding:0 10px;height:34px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line-2);background:var(--card)}
.side-search input{border:0;background:none;outline:none;flex:1;min-width:0}
.convs{flex:1;overflow-y:auto;min-height:40px;display:flex;flex-direction:column;gap:1px}
.conv{display:flex;align-items:center;border-radius:8px;color:var(--ink-2)}
.conv:hover{background:var(--hover);color:var(--ink)}
.conv.on{background:var(--sunk);color:var(--ink)}
.conv button.o{flex:1;min-width:0;border:0;background:none;color:inherit;text-align:left;padding:7px 10px;font-size:13.5px}
.conv .del{opacity:0}
.conv:hover .del,.conv .del:focus-visible{opacity:1}
.conv .run{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;animation:arc 1.2s infinite}
.acct{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:8px;text-align:left;width:100%;margin-top:6px}
.acct:hover{background:var(--hover)}
.av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex:none}
.acct small{display:block;color:var(--ink-3);font-size:12px}
.scrim{display:none}
@media (max-width:820px){.side{position:absolute;left:0;top:0;bottom:0;box-shadow:var(--shadow-lg)}.side.closed{margin-left:0;transform:translateX(-105%);box-shadow:none}.scrim.on{display:block;position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:15}}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.head{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px}
.titlebtn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:6px 10px;border-radius:8px;color:var(--ink-2);font-size:13.5px;max-width:min(52vw,480px)}
.titlebtn:hover{background:var(--hover);color:var(--ink)}
.receipt-chip{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--save);font-family:var(--f-mono);font-size:12px;padding:5px 9px;border-radius:8px}
.receipt-chip:hover{background:var(--hover)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:12px 20px 28px}
.thread{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.dock{flex:none;padding:0 20px 16px;display:flex;flex-direction:column;gap:10px}
.dock > *{max-width:720px;width:100%;margin:0 auto}
#gates{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow-y:auto}
#gates > *{flex:none}
#gates:empty,#suggest:empty{display:none}

/* empty */
.main.empty{justify-content:center}
.main.empty .scroll{flex:0 0 auto;overflow:visible}
.main.empty .dock{padding-bottom:12vh}
.hello{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:10px 0 18px}
.hello h1{margin:0;font-family:var(--f-read);font-weight:400;font-size:clamp(28px,4.2vw,38px);letter-spacing:-.015em}
.suggest{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.preview-note{font-size:12px;color:var(--ink-3);text-align:center}

/* messages */
.msg{display:flex;flex-direction:column;gap:6px;min-width:0;animation:rise .25s ease}
.msg.u{align-items:flex-end}
.bubble{max-width:min(82%,600px);background:var(--user);padding:10px 15px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.atts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.att{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line-2);background:var(--card);font-size:12.5px;max-width:240px;position:relative}
.att img{width:52px;height:52px;border-radius:8px;object-fit:cover;display:block}
.att.img{padding:0;height:auto;box-shadow:none;background:none}
.att .x{position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:50%;border:0;box-shadow:0 0 0 1px var(--line-2);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink-2)}
.hover-acts{display:flex;align-items:center;gap:1px;opacity:0;transition:opacity .15s}
.msg:hover .hover-acts,.msg:focus-within .hover-acts{opacity:1}
@media (hover:none){.hover-acts{opacity:1}}
.sib{display:inline-flex;align-items:center;font-size:12px;color:var(--ink-3);font-family:var(--f-mono)}
.editbox{width:min(100%,600px);display:flex;flex-direction:column;gap:8px}
.md{font-family:var(--f-read);font-size:16.5px;line-height:1.68;overflow-wrap:anywhere}
.md > *:first-child{margin-top:0}.md > *:last-child{margin-bottom:0}
.md p{margin:0 0 .8em}
.md h2,.md h3{font-family:var(--f-read);font-weight:600;line-height:1.3;margin:1.3em 0 .45em}
.md h2{font-size:1.14em}.md h3{font-size:1.02em}
.md ul,.md ol{padding-left:1.35em;margin:0 0 .8em}
.md li{margin:.28em 0}
.md code{font-family:var(--f-mono);font-size:.82em;background:var(--sunk);padding:.12em .36em;border-radius:5px}
.md pre{background:var(--sunk);border-radius:12px;padding:12px 14px;overflow-x:auto;font-size:13px}
.md pre code{background:none;padding:0}
.md a{color:var(--accent)}
.tbl{overflow-x:auto;margin:.4em 0 1em;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.md table{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:13.5px}
.md th,.md td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.md tr:last-child td{border-bottom:0}
.md th{font-weight:600;color:var(--ink-2);font-size:12.5px}
.caret{display:inline-block;width:7px;height:1em;background:var(--accent);vertical-align:-.13em;margin-left:2px;animation:arc .9s infinite}
.shimmer{background:linear-gradient(90deg,var(--ink-3),var(--ink) 50%,var(--ink-3));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.fold{display:inline-flex;align-items:center;gap:7px;border:0;background:none;color:var(--ink-2);padding:4px 8px;margin-left:-8px;border-radius:8px;font-size:13.5px;align-self:flex-start;max-width:100%}
.fold:hover{background:var(--hover);color:var(--ink)}
.fold .chev{transition:transform .15s}
.fold[aria-expanded="true"] .chev{transform:rotate(90deg)}
.thought{font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;line-height:1.6;padding:2px 0 4px 14px;border-left:2px solid var(--line-2)}

/* receipt line */
.rline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:28px}
.receipt{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:3px 8px;margin-left:-8px;border-radius:8px;font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.receipt:hover{background:var(--hover);color:var(--ink-2)}
.receipt .s{color:var(--save)}
.receipt .pill{font-family:var(--f-ui);font-size:11px;padding:0 6px;border-radius:99px;background:var(--sunk);color:var(--ink-2)}
.why{border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:12px;font-size:13px;animation:rise .2s ease}
.why ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.why li{display:flex;gap:8px}
.why li .k{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);min-width:78px}
.costs{display:flex;flex-direction:column;gap:6px;font-family:var(--f-mono);font-size:12px}
.costs .r{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center}
.trk{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.trk i{display:block;height:100%;border-radius:99px}
.tiercost{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);padding-top:10px;border-top:1px solid var(--line)}

/* tree + live run (the spine) */
.tree{display:flex;flex-direction:column;gap:2px}
.tn{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.tn.l1{padding-left:16px}.tn.l2{padding-left:32px}
.tn .lbl{color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn.done .lbl{color:var(--ink-2)}
.tn .m{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.tn .st{display:inline-flex;align-items:center;justify-content:center}
.tn .pb{grid-column:2 / 4;height:2px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:2px}
.tn .pb i{display:block;height:100%;background:var(--ramp-x);transition:width .3s}
.st-ok{color:var(--save)}.st-esc{color:var(--warn)}.st-fail{color:var(--bad)}.st-skip{color:var(--ink-3)}
.live{display:grid;grid-template-columns:3px 1fr;gap:16px;animation:rise .25s ease}
.spine{border-radius:3px;background:linear-gradient(180deg,#4C8DFF,#38B0DE,#2DD4BF,#38B0DE,#4C8DFF);background-size:100% 200%;animation:flow 2.4s linear infinite}
.live-b{display:flex;flex-direction:column;gap:10px;min-width:0}
.live-s{display:flex;align-items:center;gap:9px;font-size:14px}
.planline{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px 14px}
.planline span{display:inline-flex;align-items:center;gap:6px}
.secs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink-2)}
.secs li{display:flex;gap:8px}
.secs .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);width:14px}
.note{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.note .ic{color:var(--ink-3)}
.note.warn .ic{color:var(--warn)}
.review{border-radius:12px;background:color-mix(in srgb,var(--warn) 8%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 25%,transparent);padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}

/* file card */
.file{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);max-width:520px;flex-wrap:wrap}
.ficon{width:34px;height:40px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-family:var(--f-mono);font-size:8.5px;font-weight:600;color:#fff;background:#2B579A;flex:none}
.ficon.pptx{background:#C43E1C}.ficon.xlsx{background:#107C41}.ficon.pdf{background:#B30B00}.ficon.md{background:#57606A}
.file .meta{flex:1;min-width:140px}
.file .meta b{display:block;font-weight:500}

<script type="text/plain" id="ans-pg">For a CLI tool's local storage, **SQLite** is the better default. Postgres only earns its place once several machines need to read and write the same data.

| | SQLite | Postgres |
|---|---|---|
| Setup | None: one file next to the app | A running server |
| Concurrency | One writer at a time (WAL helps a lot) | Many concurrent writers |
| Distribution | Ships inside the package | Separate install or container |
| Backups | Copy the file | `pg_dump` or replication |
| Best for | Per-user state, history, caches | Shared, multi-user data |

**Recommendation:** use SQLite with WAL mode (`PRAGMA journal_mode = WAL`) through `better-sqlite3` for fast synchronous access. Keep storage behind a small interface so a Postgres adapter can slot in if you add hosted sync later.</script>
<script type="text/plain" id="ans-pg-v1">Use **SQLite**. It needs no server, stores everything in one file, and handles a single user's history and settings comfortably. Reach for Postgres only if several machines must share the data.</script>

- **Claude Code** goes deepest on agentic editing and permission controls. It is a single agent on one vendor's models.
- **Gemini CLI** has the most generous free tier and a very long context window. Also a single agent.
- **Copilot CLI** wins on GitHub integration (issues, PRs, Actions) for teams already on a Copilot plan.
- **Cascade** is the only one that delegates across tiers and routes each step to a different provider, which is where its cost advantage comes from.

2. Ship the VS Code extension. All three rivals have an editor surface.

<script type="text/plain" id="dp-what" data-group="Get started" data-tab="guides" data-kind="Article" data-title="What is Cascade" data-summary="A multi-tier AI orchestrator that turns one prompt into an organization of agents.">
Cascade is a multi-tier AI orchestrator. Instead of sending every request to one expensive model, it routes work across three tiers:

- **Tier 1: Administrator** plans the task and delegates.
- **Tier 2: Supervisor** breaks work down and coordinates.
- **Tier 3: Worker** does the actual generation.

Simple asks are answered directly; complex ones fan out across the tiers. You bring your own provider API keys, so you pay providers directly and your data stays yours.

## Where you can use it

| Surface | What it is |
|---|---|
| **Web app** | Hosted chat at cascadeai.in with files, memory, generated documents and browser control. Bring your own keys. |
| **Desktop app** | Chat, a live Cockpit of the agent tree, a code editor with a terminal, and a browser the agent can drive. |
| **CLI** | Interactive REPL and one-shot runs in your terminal. |
| **Self-host** | The web app on your own machine with `docker compose up`. |
| **OpenAI-compatible API** | `POST /v1/chat/completions` for any OpenAI SDK. |
| **SDK** | `runCascade()` and `createCascade()` from Node. |

The CLI, desktop app and web app share one account. Settings can follow you between them through opt-in, end-to-end encrypted sync.

## What makes it different

- **Delegation savings.** Every run shows what the hierarchy saved against running everything on T1, for example `saved $5.63 · 90% vs. all-T1`.
- **Live benchmark Auto-routing.** Set a tier to Auto and Cascade weighs public benchmark scores against live pricing to pick the best-value model for each task.
- **Asks instead of guessing.** When a request is genuinely ambiguous, Cascade asks one structured question instead of inventing an answer.
- **Safe by default.** Permission escalation (T3 → T2 → T1 → you), an SSRF-guarded fetch, and a budget kill-switch.

> **Tip** New here? Start with the [Quick start](#dp-quickstart).
</script>
<script type="text/plain" id="dp-quickstart" data-group="Get started" data-tab="guides" data-kind="Article" data-title="Quick start" data-summary="Send your first orchestrated prompt in the web app or the CLI.">
## In the web app

1. Sign in at cascadeai.in with GitHub or Google.
2. Open **Settings → API keys** and add a key for at least one provider: OpenAI, Anthropic, Google, Azure, or any OpenAI-compatible endpoint.
3. Type a request in the composer and send it. Cascade picks the tiers and the models.
4. Watch the run. Each answer shows which tier and model handled it, and **/why** explains the routing and what it saved against running everything on the top model.

## In the terminal

```bash
# 1. Install (Node.js 22 or newer)
npm install -g cascade-ai

# 2. Initialize a project
cd my-project
cascade init

# 3. Set at least one key (or add it to .env)
export ANTHROPIC_API_KEY=sk-ant-...

# 4. Check everything is working
cascade doctor

# 5. Start the REPL, or run one prompt
cascade
cascade run "explain the auth module in this repo"
```

> **Note** Already use Claude Code, Codex, Gemini CLI or Copilot CLI? `cascade link` lists API keys it can reuse from them. Subscription logins are detected but never adopted.
</script>
<script type="text/plain" id="dp-install" data-group="Get started" data-tab="guides" data-kind="Article" data-title="Install & surfaces" data-summary="Get the desktop app, the CLI, or run the web app yourself.">
## Desktop app

Download it from cascadeai.in/download. The site detects your platform and architecture and shows the size and version. Stable links never go stale:

| Platform | Build |
|---|---|
| macOS | Apple silicon (`mac-arm64`) or Intel (`mac-x64`) |
| Windows | `win-x64` |
| Linux | AppImage, `.deb`, `.rpm` or pacman |

The desktop app is free.

## CLI

```bash
npm install -g cascade-ai
cascade --version
```

Requires Node.js 22 or newer. Shell completions ship for Bash, Zsh and Fish.

## Web app

Nothing to install. Sign in at cascadeai.in; the same account works in the desktop app and the CLI (`cascade login`).

> **Tip** To run the web app on your own machine, see [Self-host](#dp-selfhost).
</script>
<script type="text/plain" id="dp-tiers" data-group="Concepts" data-tab="guides" data-kind="Article" data-title="How the tiers route" data-summary="Complexity decides how much of the organization a task gets, and Auto picks the model for each tier.">
A classifier grades each prompt (cheap heuristics first) and only the tiers the work needs are spun up.

| Complexity | Tiers in play | Shape |
|---|---|---|
| Simple | T3 | One worker answers directly. Small talk gets an answer with no worker at all. |
| Moderate | T2 → T3 | One manager and its workers, no planner. |
| Complex | T1 → T2 → T3 | T1 plans 3–5 sections, one T2 manager each. |
| Highly complex | T1 → T2 → T3 | 5 or more sections. |

## Cascade Auto

Every tier can be set to a specific model or to **Cascade Auto**. Auto ranks the models your providers actually serve by a benchmark-quality score against price, so a cheaper model that is good enough wins the cheap work and the strongest model is saved for the hard work. Newly released models are scored by their class until the benchmark table catches up.

Pin a model to a tier and that pin is authoritative; Auto only applies to tiers you leave on Auto. In the web app you can also bias Auto toward **Quality** or **Fast**, and force a single tier for a one-off request.

## Failover

Failover is per failure type: a rate limit backs off, an exhausted quota or a model your key cannot use is routed around, and a recovered provider is used again.

> **Note** Run `/why` in the CLI, or open **/why** under any answer, to see the complexity verdict, the model each tier used, failovers and escalations.
</script>
<script type="text/plain" id="dp-providers" data-group="Concepts" data-tab="guides" data-kind="Article" data-title="Providers & API keys" data-summary="Cascade is bring-your-own-key across six providers.">
Add keys under **Settings → API keys**. Keys are encrypted on your device before they are stored, and account sync moves them between your devices end-to-end encrypted. The server relays ciphertext it cannot read.

## Supported providers

- Anthropic, including gateways reached through `ANTHROPIC_BASE_URL`
- OpenAI
- Google Gemini
- Azure OpenAI, with any number of deployments across resources
- OpenAI-compatible endpoints: OpenRouter, Groq, DeepSeek, xAI, Mistral, Together, Fireworks, llama.cpp, vLLM, LM Studio
- Ollama, for local models

Models are discovered from each provider at startup, so new releases compete in routing without a Cascade update.

## Environment variables (CLI)

| Provider | Variable |
|---|---|
| Anthropic | `ANTHROPIC_API_KEY`, or a gateway's `ANTHROPIC_AUTH_TOKEN` with its `ANTHROPIC_BASE_URL` |
| OpenAI | `OPENAI_API_KEY` |
| Gemini | `GOOGLE_API_KEY` |
| Azure | `AZURE_OPENAI_KEY` with `AZURE_OPENAI_ENDPOINT` and `AZURE_OPENAI_DEPLOYMENT` |

## Is this endpoint free?

An OpenAI-compatible endpoint is either your own hardware, where inference costs nothing, or somebody's paid API. Set `local` to say which: `true` reports $0; `false` prices calls from the pricing dataset and reports "cost not tracked" for a model it can't price, never $0.00.

> **Warning** Subscription tokens (Claude Free, Pro or Max; ChatGPT login; Gemini CLI; Copilot CLI) are detected but never adopted. They are locked to their vendor's own backend.
</script>
<script type="text/plain" id="dp-files" data-group="Concepts" data-tab="guides" data-kind="Article" data-title="Files & document exports" data-summary="Ask for a file and get a real PDF, Word, Excel or PowerPoint document.">
A run streams text, so the model writes the source and your browser renders the real binary on download. Nothing is rendered on a server and your content never leaves the client.

| Ask for | Written as | You get |
|---|---|---|
| PDF | Markdown | A `.pdf` with selectable text |
| Word | Markdown | A `.docx` with headings, lists, tables, code and quotes |
| Excel | CSV | A real `.xlsx` workbook |
| PowerPoint | A Markdown deck | A `.pptx`, slides split on `---`, each led by a heading |

Every generated file can be **viewed**, **downloaded** for free, or **saved** to your Cascade storage, which is metered by plan. Plain code, CSV, JSON and Markdown files work the same way.

In the CLI and desktop app, the `generate_document` tool writes the same formats to disk and can embed generated images and turn a `chart:bar` block into an editable PowerPoint chart.
</script>
<script type="text/plain" id="dp-privacy" data-group="Concepts" data-tab="guides" data-kind="Article" data-title="Privacy & security" data-summary="Your keys stay yours, and every run is contained.">
Your provider keys are encrypted on-device, synced end-to-end, and used to call providers directly. Document rendering happens entirely in your browser. You can delete any chat or file at any time, and clear everything from Settings.

## What keeps a run contained

- **Permission escalation.** A worker that needs more than it was given asks up the chain: T3 → T2 → T1 → you.
- **SSRF-guarded fetching.** `web_fetch` and hosted search cannot reach private or link-local addresses, checked again at connect time.
- **Secret redaction.** Secrets and PII are stripped from a worker's output before it travels up the hierarchy.
- **Privacy paths.** `privacy.paths` forces local models for sensitive folders named in a worker's assignment.
- **Hash-chained audit log.** `/audit` checks the chain for edited or removed entries.
- **Budget kill-switch.** A run stops at its token budget; `/continue` resumes it with a raised one.

## Where the CLI stores keys

Keys you add are written to `~/.cascade-ai/credentials.json` (mode `0600`) and the workspace's `.cascade/config.json`. Keep `.cascade/` out of version control.

> **Warning** Agent-written tools are confined only when the optional `isolated-vm` addon is installed. Set `"enableToolCreation": false` if that matters to you.
</script>
<script type="text/plain" id="dp-chat" data-group="Using the app" data-tab="guides" data-kind="Article" data-title="Chatting with Cascade" data-summary="Everything the composer and the run view can do.">
## The composer

- **Attach** up to six images (PNG, JPEG, GIF, WebP) or documents (PDF, Word, text, Markdown, CSV, JSON, YAML, HTML). Drag files in or paste them.
- **Skill** picks a persona for the chat. See [Skills & Memory](#dp-skills).
- **Routing**: **Auto** balances cost and quality, **Quality** leans toward stronger models, **Fast** toward cheaper ones.
- **Tier** pins one message to T1, T2 or T3.
- **Web** allows web search and fetch for the run. **Browser** lets the agent drive a real browser instead.
- **Fast answer** (the lightning button) sends to one quick model and skips orchestration.

## While a run works

The status line opens **Run activity**: the live tree of the administrator, managers and workers, the model each uses and its progress. In the Advanced view you also see the plan: sections, manager and worker counts, and the estimated cost. If a review finds gaps, a **Review** card explains them and the section is replanned; you can **Skip and keep**.

## When Cascade needs you

- **A question.** An ambiguous request gets one structured question with a two-minute timer. Answer it, or choose **Skip, decide for me**.
- **A tool approval.** Dangerous tools show their exact arguments. Choose **Allow once**, **Allow for this run**, or **Deny**.
- **An escalation.** A section that needs a decision pauses the run. Retry, skip it, or send guidance.
- **The browser.** Watch it live, **Take over** to drive it yourself, **Hand back**, or **Stop browser** without stopping the run.

## Every answer

Copy, rate with thumbs up or down (it teaches Auto-routing), regenerate, or delete. Edit your own message to start a new **branch**; the ‹ 1/2 › arrows switch versions. **/why** shows the routing decisions, the cost per tier and what delegation saved.
</script>
<script type="text/plain" id="dp-skills" data-group="Using the app" data-tab="guides" data-kind="Article" data-title="Skills & Memory" data-summary="Reusable personas, and facts Cascade remembers across chats.">
## Skills

Skills are reusable personas Cascade adopts for a chat. Five are built in: General assistant, Code reviewer, Research analyst, Writing editor and Brainstorm partner. Create your own under **Settings → Skills** with a name, a short description and instructions (the system prompt the skill follows).

## Memory

Memory holds facts Cascade remembers across chats. Each one is either:

- **Always true**: holds until you change it, or
- **Current context**: expected to change; what you say now wins if it conflicts.

Turn on **Settings → Privacy → Remember chats in Memory** to let Cascade distill durable facts after a chat. It's off by default, and you can search, edit and delete every memory.

> **Tip** Moving from another assistant? **Import chats or memories** takes a JSON export with `sessions` and `memories`.
</script>
<script type="text/plain" id="dp-connectors" data-group="Using the app" data-tab="guides" data-kind="Article" data-title="Connectors & MCP" data-summary="Connect apps and any Model Context Protocol server.">
Connect an app or any **MCP server** under **Settings → Connectors & MCP**. Enabled connections are available to every chat, and you choose which of each server's tools can be used.

Built-in connectors: GitHub, Notion, Linear, Sentry, Jira & Confluence, Stripe, Cloudflare Docs, Slack and Google. Or point at any remote (https) MCP endpoint.

Connecting can run a real **OAuth** sign-in, with PKCE and dynamic client registration handled by the MCP SDK. Servers that don't support OAuth accept a pasted token instead.

## In the CLI

```bash
cascade mcp connect https://mcp.example.com/sse   # OAuth login in your browser
cascade mcp list
cascade mcp remove <name>
```

Local (stdio) servers go in `.cascade/config.json` under `tools.mcpServers`. List each one in `tools.mcpTrusted` too; an untrusted server is refused before it starts.
</script>
<script type="text/plain" id="dp-sync" data-group="Using the app" data-tab="guides" data-kind="Article" data-title="Sync & continue elsewhere" data-summary="Move keys, settings and chats between web, desktop and CLI.">
## Key sync

Provider keys, web-search keys, MCP tokens and preferences can follow your account across web, desktop and CLI. The bundle is encrypted on the device with AES-256-GCM, using a passphrase only you know. The server stores one encrypted envelope it cannot read.

Sync is manual: **Push** uploads this device's settings, **Pull** applies them. A wrong passphrase is reported as "check your passphrase".

```bash
cascade login
cascade sync push
cascade sync pull
```

## Continue elsewhere

In a chat, choose **Continue elsewhere** to get a one-time code (it expires in ten minutes). In the other app, open **Continue elsewhere → Bring a chat here** and enter it.
</script>
<script type="text/plain" id="dp-cli" data-group="Reference" data-tab="cli" data-kind="Command-line tool" data-title="CLI reference" data-summary="Every cascade command and option.">
```bash

cascade models [action] [tier] [v]   # List or set a tier's model
cascade stats                        # What Auto-routing has learned
cascade index [path]                 # Build the code index for code_search
cascade export                       # Export a session to Markdown or JSON
cascade identity list|create|set-default
cascade mcp connect <url>|list|remove
cascade dashboard                    # Launch the local web dashboard
cascade telemetry [on|off|status]
cascade update
```

## Account commands

| Command | Does |

| `cascade login` · `logout` · `whoami` | Sign in to your Cascade account on this machine |
| `cascade sync push` · `pull` | Encrypt and upload, or download, your settings |

</script>

<script type="text/plain" id="dp-config" data-group="Reference" data-tab="cli" data-kind="Command-line tool" data-title="Configuration" data-summary="The .cascade/config.json file.">
Cascade loads config from `.cascade/config.json` in your project. The file is strict JSON, no comments.

> **Tip** Prefer `/model` in the REPL: a three-step picker (provider → tier → model) that writes the file and hot-swaps the router without a restart.

```json
{
  "version": "1.0",
  "providers": [
    { "type": "anthropic", "apiKey": "sk-ant-..." },
    { "type": "openai", "apiKey": "sk-..." },
    { "type": "ollama" }
  ],
  "models": { "t3": "llama3.2:3b" },
  "autoBias": "balanced",
  "tools": {
    "shellBlocklist": ["sudo rm", "rm -rf", "mkfs"],
    "requireApprovalFor": ["shell", "file_write", "file_delete"],
    "mcpTrusted": ["filesystem"]
  },
  "theme": "midnight",
  "planApproval": "never"
}
```

## Keys worth knowing

| Key | Effect |
|---|---|
| `models` | Pins a tier to a model; a tier left out stays on Auto |
| `autoBias` | `"balanced"`, `"quality"` or `"cost"` |
| `planApproval` | `"always"` pauses Complex runs so you can approve T1's plan first |
| `codeIndex.enabled` | Turns on `code_search`; build it with `cascade index` |
| `altScreen` | Render the TUI in the alternate screen buffer |

## Project files

- `CASCADE.md` gives agents project-specific instructions; `cascade init` writes a template.
- `.cascadeignore` lists files agents cannot touch, in `.gitignore` syntax. `.env`, keys and Cascade's own database are always protected.
</script>
<script type="text/plain" id="dp-api" data-group="API & SDK" data-tab="api" data-kind="API" data-title="OpenAI-compatible API" data-summary="Call Cascade from any OpenAI SDK.">
Point your client's `base_url` at the server's `/v1` and use a Cascade access token as the API key. `POST /v1/chat/completions` and `GET /v1/models` work with the official SDKs, streaming and not.

```python
from openai import OpenAI

client = OpenAI(api_key=CASCADE_ACCESS_TOKEN, base_url="https://cascadeai.in/v1")

reply = client.chat.completions.create(
    model="cascade",
    messages=[{"role": "user", "content": "Compare Postgres and SQLite for a CLI tool."}],
)
print(reply.choices[0].message.content)
print(reply.cascade)   # which tier and model served it, and what routing saved
```
```js
import OpenAI from "openai";

const client = new OpenAI({ apiKey: process.env.CASCADE_ACCESS_TOKEN, baseURL: "https://cascadeai.in/v1" });

const reply = await client.chat.completions.create({
  model: "cascade",
  messages: [{ role: "user", content: "Compare Postgres and SQLite for a CLI tool." }],
});
console.log(reply.choices[0].message.content);
```
```bash
curl https://cascadeai.in/v1/chat/completions \
  -H "Authorization: Bearer $CASCADE_ACCESS_TOKEN" \
  -H "Content-Type: application/json" \
  -d '{"model":"cascade","messages":[{"role":"user","content":"Hello"}]}'
```

## Models are routing modes

Cascade picks a model per subtask, so `model` selects a **routing mode**:

| `model` | What runs |
|---|---|
| `cascade` | Full orchestration, balanced quality against cost |
| `cascade-fast` | One mid-tier model, no orchestration |
| `cascade-quality` | Full orchestration, biased to quality |

Anything else returns `404 model_not_found`. Each reply carries the usual `usage` block plus a `cascade` object naming the tier and model that actually served it.

> **Warning** Unsupported parameters (`n > 1`, `logprobs`, `tools`, `response_format`) are rejected, not ignored. `temperature` and `max_tokens` are honoured across tiers.
</script>
<script type="text/plain" id="dp-sdk" data-group="API & SDK" data-tab="api" data-kind="API" data-title="SDK" data-summary="Run Cascade from Node with runCascade, streamCascade and createCascade.">
```ts
import { runCascade, createCascade, streamCascade } from 'cascade-ai';

// Simple run
const result = await runCascade('Write a Fibonacci function in TypeScript');
console.log(result.output);

// Streaming
await streamCascade('Explain this codebase', (token) => process.stdout.write(token));

// Full control

## Cancellation

Pass an `AbortSignal` to stop a run. Every tier halts at the next safe checkpoint, before its next model call, and `run()` resolves with the partial output instead of rejecting.

```ts
const controller = new AbortController();
cascade.on('run:cancelled', ({ taskId, reason, partialOutput }) => { /* … */ });
const run = cascade.run({ prompt: 'Perform a deep codebase audit', signal: controller.signal });
setTimeout(() => controller.abort('User requested stop'), 10_000);
const result = await run;
```

<script type="text/plain" id="dp-selfhost" data-group="API & SDK" data-tab="api" data-kind="Article" data-title="Self-host" data-summary="Run the web app, API and socket on one port with Docker.">
```bash
cp .env.example .env
echo "SESSION_SECRET=$(openssl rand -base64 32)" >> .env
echo "CLOUD_DEV_BYPASS=1" >> .env    # local-only sign-in
docker compose up                    # → http://localhost:8787
```

`docker compose up` builds the image, serves the web UI from the server, and keeps the SQLite database and uploads in a named volume so a restart doesn't wipe them. `.env.example` documents every variable the server reads.

> **Warning** `CLOUD_DEV_BYPASS` is an authentication bypass: anyone who can reach the port can sign in as anyone. That's why `docker-compose.yml` publishes to `127.0.0.1` only. Before exposing the server, set `GITHUB_CLIENT_ID` or `GOOGLE_CLIENT_ID` for real OAuth, remove the bypass, and only then change the port binding.

## Provider keys on a self-host

On a single-account instance the OpenAI-compatible endpoint uses the keys in your `.env`. The moment a second account exists this stops automatically, so the operator's key never pays for someone else's runs.

/* ================= RUNS ================= */
const CANCEL=Symbol('cancel');
function wait(ms){ const R=S.run; return new Promise((ok,no)=>{ const t=setTimeout(()=>{ if(!S.run||S.run!==R||R.dead) no(CANCEL); else ok(); },ms*(S.reduce?.35:1)); R.rej.push(()=>{ clearTimeout(t); no(CANCEL); }); }); }
function hold(setup){ const R=S.run; return new Promise((ok,no)=>{ R.rej.push(()=>no(CANCEL)); setup(ok); }); }
function status(s){ S.run.status=s; refreshLive(); }
function act(id,o){ const R=S.run; let a=R.activity.find(x=>x.id===id); if(!a){ a={id,pct:0}; R.activity.push(a); } Object.assign(a,o); refreshLive(); }
function kind(p,o){ const s=p.toLowerCase(); if(o.fast) return 'fast'; if(S.browser) return 'browser';
  if(/^(hi|hello|hey|thanks|thank you|good (morning|evening|afternoon))\b/.test(s)&&s.length<30) return 'simple';
  if(/offsite|trip|party|event/.test(s)&&s.split(/\s+/).length<9) return 'clarify';
  if(/(github|repo)/.test(s)&&/(every|all|org)/.test(s)) return 'escalate';
  if(/report|research|competitor|analy[sz]e|deck|docx|word doc|excel|pdf|build/.test(s)) return 'complex';
  if(/postgres|sqlite/.test(s)) return 'pg'; return 'generic'; }
async function run(c,u,o={}){
  if(S.usage.runs>=S.usage.limit) return toast('Daily limit reached. Upgrade for 200 runs a day.');
  const K=kind(u.content,o), mode=S.routing, M=MODELS[mode];
  const a=add(c,u.id,{role:'a',content:'',streaming:true});
  S.run={cid:c.id,dead:false,rej:[],status:'Reading your request',activity:[],plan:null,review:null,notes:[]};
  if(S.set.memory&&K!=='simple'&&K!=='fast') S.run.notes.push(['info','Using 2 facts from Memory']);
  if(o.compact) S.run.notes.push(['info','Long input summarized to fit the window']);
  S.stick=true; renderThread(); renderSend(); renderSide(); renderHead(); scrollDown();
  let f;
  try{ await wait(450);
    if(K==='fast'){ status('Fast answer, one model'); await wait(500); f={tier:'T2',content:generic(u.content,'Fast: one mid-tier model',0.0008*M.m,62),why:why('T2','Fast answer, orchestration skipped',mode),fast:true}; }
    else if(K==='simple'){ status('Answering directly'); act('w',{role:'T3',label:'Direct answer',st:'run',model:M.T3}); await wait(600); act('w',{st:'done'}); f={tier:'T3',content:txt('ans-hi'),why:why('T3','Small talk, answered directly',mode)}; }
    else if(K==='pg'){ await moderate(M,['Draft the comparison table','Write the recommendation']); f={tier:'T2',content:txt('ans-pg'),why:why('T2','Moderate: one comparison',mode)}; }
    else if(K==='complex') f=await complex(M,mode,u.content);
    else if(K==='clarify') f=await clarify(M,mode);
    else if(K==='browser') f=await browse(M,mode);
    else if(K==='escalate') f=await escalate(M,mode);
    else { await moderate(M,['Outline','Fill in the details']); f={tier:'T2',content:generic(u.content,'Moderate: one manager, two workers',0.0021*M.m,76),why:why('T2','Moderate',mode)}; }

async function addFiles(fs){ const ok=Array.from(fs).filter(f=>/^image\/(png|jpeg|gif|webp)$/.test(f.type)||/\.(pdf|docx|txt|md|csv|tsv|json|xml|html?|ya?ml)$/i.test(f.name)); if(!ok.length) return toast('Attach images, PDF, Word or text files.');
  for(const f of ok){ if(S.pending.length>=6){ toast('Up to 6 files per message.'); break; } if(f.type.startsWith('image/')) S.pending.push({id:nid('a'),kind:'img',name:f.name,url:URL.createObjectURL(f)}); else { let ch=Math.round(f.size*.9); if(/\.(txt|md|csv|tsv|json|xml|html?|ya?ml)$/i.test(f.name)){ try{ ch=(await f.text()).length; }catch(e){} } S.pending.push({id:nid('a'),kind:'doc',name:f.name,chars:ch}); } } renderAtts(); }
async function importFile(f){ try{ const d=JSON.parse(await f.text()); let c=0,m=0; (Array.isArray(d.sessions)?d.sessions.slice(0,100):[]).forEach(s=>{ const ms=(s.messages||[]).filter(x=>String(x.content||'').trim()); if(!ms.length) return; const cv=newConv(s.title||'Imported chat'); let p=null; ms.forEach(x=>{ p=add(cv,p,{role:x.role==='assistant'?'a':'u',content:String(x.content),tier:'T2',model:'imported'}).id; }); S.convs.unshift(cv); c++; }); (Array.isArray(d.memories)?d.memories:[]).forEach(x=>{ const t=typeof x==='string'?x:x&&x.content; if(t){ S.memories.push({id:nid('m'),text:t,kind:'permanent'}); m++; } }); toast(c||m?`Imported ${c} chats, ${m} memories`:'Nothing to import in that file'); renderSide(); }catch(e){ toast('Use a JSON export with sessions or memories.'); } }

  b.querySelectorAll('blockquote').forEach(q=>{ const s=q.querySelector('p > strong:first-child'); if(!s) return; const k=s.textContent.trim().toLowerCase(); if(!['note','tip','warning'].includes(k)) return; s.remove(); q.className='callout '+k; q.insertAdjacentHTML('afterbegin',`<div class="ch">${k[0].toUpperCase()+k.slice(1)}</div>`); });
  b.querySelectorAll('a[href^="#dp-"]').forEach(a=>a.dataset.doc=a.getAttribute('href').slice(1));
  Array.from(b.querySelectorAll('pre')).forEach(pre=>{ const c=pre.querySelector('code'); pre.dataset.lang=((c&&c.className.match(/language-(\w+)/))||[])[1]||''; });
  Array.from(b.querySelectorAll('pre')).forEach(pre=>{ if(!pre.parentNode||pre.closest('.cg')) return; const g=[pre]; let n=pre.nextElementSibling; while(n&&n.tagName==='PRE'){ g.push(n); n=n.nextElementSibling; }

    g.forEach((x,i)=>{ if(i) x.hidden=true; w.appendChild(x); }); });
  return {html:b.innerHTML,toc}; }

function applyTheme(){ const r=document.documentElement; if(S.theme==='system'){ if(hostTheme) r.setAttribute('data-theme',hostTheme); else r.removeAttribute('data-theme'); } else r.setAttribute('data-theme',S.theme); document.body.classList.toggle('no-motion',S.reduce); }

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const mi=e.target.closest('[data-mi]'); if(mi&&S.menu){ const it=S.menu.L[+mi.dataset.mi]; if(it.t==='a'){ closeMenu(); it.fn(); } else { it.fn(); drawMenu(); refreshBar(); const tb=$('#toolsbtn'); if(tb) tb.style.color=S.web||S.browser?'var(--accent)':''; } return; }
  if(S.menu&&!e.target.closest('.menu')){ const same=e.target.closest('[data-menu]'); const k=S.menu.k; closeMenu(); if(same&&same.dataset.menu===k) return; }
  const t=e.target.closest('button,[data-overlay],[data-act="close-side"],a[data-doc]'); if(!t) return; const d=t.dataset;
  if(d.overlay){ if(e.target===t) closeModal(); return; }
  if(d.menu) return openMenu(d.menu,t);
  if(d.view){ S.view=d.view; store.set('cv2-view',d.view); render(); const h=$('#home'); if(h) h.scrollTop=0; return; }
  if(d.doc){ e.preventDefault(); return goDoc(d.doc); }
  if(d.toc){ const h=document.getElementById(d.toc); if(h) h.scrollIntoView({behavior:S.reduce?'auto':'smooth'}); return; }
  if(d.ctabi!=null){ const g=t.closest('.cg'); g.querySelectorAll('pre').forEach((p,i)=>p.hidden=i!==+d.ctabi); g.querySelectorAll('[data-ctabi]').forEach(b=>b.setAttribute('aria-selected',String(b===t))); return; }
  if(d.copycode){ const p=Array.from(t.closest('.cg').querySelectorAll('pre')).find(x=>!x.hidden); return copy(p.innerText); }
  if(d.scrollto){ const el=document.getElementById(d.scrollto); if(el) el.scrollIntoView({behavior:S.reduce?'auto':'smooth'}); return; }
  if(d.open){ S.active=d.open; S.editing=null; S.renaming=false; S.pane=null; if(!wide(820)) S.side=false; S.stick=true; renderApp(); return; }
  if(d.del) return delConv(d.del);
  if(d.sugg!=null){ if(S.run) return toast('One run at a time on Free.'); const s=SUGG[+d.sugg]; if(s[3]){ S.browser=true; S.web=false; } $('#ta').value=s[1]; return send(false); }
  if(d.untok){ ({fast:()=>S.fastNext=false,web:()=>S.web=false,browser:()=>S.browser=false,skill:()=>S.skill='general'})[d.untok](); return refreshBar(); }
  if(d.copy) return copy(conv().nodes[d.copy].content);
  if(d.edit){ S.editing=d.edit; renderThread(); const a=$('#editta'); if(a){ a.focus(); a.setSelectionRange(a.value.length,a.value.length); } return; }
  if(d.delmsg){ const c=conv(); if(S.run&&S.run.cid===c.id) return toast('Stop the run first.'); del(c,d.delmsg); renderThread(); renderHead(); return; }
  if(d.sib){ const c=conv(); step(c,c.nodes[d.sib],+d.d); S.stick=false; renderThread(); renderHead(); return; }
  if(d.regen){ if(S.run) return; const c=conv(); return run(c,c.nodes[c.nodes[d.regen].parent]); }
  if(d.thumb){ S.thumbs[d.thumb]=S.thumbs[d.thumb]===d.v?null:d.v; S.stick=false; renderThread(); if(S.thumbs[d.thumb]) toast('Thanks. Auto-routing learns from this.'); return; }
  if(d.why){ S.open['w'+d.why]=!S.open['w'+d.why]; S.stick=false; renderThread(); return; }
  if(d.toggle){ S.open[d.toggle]=!S.open[d.toggle]; S.stick=false; renderThread(); return; }
  if(d.viewfile) return showFile(Object.values(conv().nodes).flatMap(n=>n.files||[]).find(f=>f.id===d.viewfile));
  if(d.viewsaved){ const f=S.files.find(x=>x.id===d.viewsaved); return showFile({name:f.name,ext:f.name.split('.').pop(),src:f.src}); }
  if(d.dl) return toast(`Cascade downloads ${d.dl} here. Downloads are off in this preview.`);
  if(d.savefile){ const f=Object.values(conv().nodes).flatMap(n=>n.files||[]).find(x=>x.id===d.savefile); S.saved[f.id]=1; S.files.unshift({id:nid('f'),name:f.name,size:f.size,when:'Just now',src:f.src}); S.stick=false; renderThread(); renderPane(); return toast('Saved to Files'); }
  if(d.rmfile){ S.files=S.files.filter(f=>f.id!==d.rmfile); return renderPane(); }
  if(d.rmatt){ S.pending=S.pending.filter(a=>a.id!==d.rmatt); return renderAtts(); }
  if(d.clopt){ const q=S.clar.qs.find(x=>x.id===d.clopt); if(q.k==='multi'){ const c=S.clar.draft[q.id]||[]; S.clar.draft[q.id]=c.includes(d.v)?c.filter(v=>v!==d.v):c.concat(d.v); } else S.clar.draft[q.id]=S.clar.draft[q.id]===d.v?undefined:d.v; return renderGates(); }
  if(d.appr){ const a=S.approvals.shift(); if(d.appr==='run') S.run.allowAll=true; renderGates(); return a.ok(d.appr!=='deny'); }
  if(d.esc){ const note=(($('#escnote')||{}).value||'').trim(); if(d.esc==='guidance'&&!note) return toast('Type your guidance first.'); const ok=S.esc.ok; S.esc=null; return ok({a:d.esc,note}); }
  if(d.tab){ tab=d.tab; return remodal(); }
  if(d.sw){ const k=d.sw; if(k==='detail') S.detail=!S.detail; else if(k==='reduce'){ S.reduce=!S.reduce; applyTheme(); } else { S.set[k]=!S.set[k]; if(k==='webDefault') S.web=S.set.webDefault; } refreshLive(); refreshBar(); return remodal(); }
  if(d.seg){ if(d.seg==='theme'){ S.theme=d.v; applyTheme(); renderStrip(); } else { S.set.bias=d.v; S.routing=d.v; refreshBar(); } remodal(); return paint(); }
  if(d.skuse){ S.skill=d.skuse; refreshBar(); return remodal(); }
  if(d.skdel){ S.custom=S.custom.filter(s=>s.id!==d.skdel); if(S.skill===d.skdel) S.skill='general'; refreshBar(); return remodal(); }
  if(d.memdel){ S.memories=S.memories.filter(m=>m.id!==d.memdel); return remodal(); }
  if(d.connon){ S.connected[d.connon].on=!S.connected[d.connon].on; return remodal(); }
  if(d.connrm){ delete S.connected[d.connrm]; return remodal(); }
  if(d.connadd){ t.disabled=true; t.textContent='Signing in…'; setTimeout(()=>{ const c=CONNECTORS.find(x=>x.id===d.connadd); S.connected[c.id]={on:true,tools:Object.fromEntries(c.tools.map(x=>[x,true]))}; remodal(); toast(c.name+' connected'); },900); return; }
  if(d.keyrm){ S.keys=S.keys.filter(k=>k.id!==d.keyrm); remodal(); return renderComposer(); }
  if(d.ctab){ S.ctab=d.ctab; return remodal(); }
  switch(d.act){
    case 'theme': S.theme=S.theme==='system'?'light':S.theme==='light'?'dark':'system'; applyTheme(); renderStrip(); paint(); break;
    case 'toggle-side': S.side=!S.side; renderSide(); renderHead(); break;
    case 'close-side': S.side=false; renderSide(); renderHead(); break;
    case 'new': S.active=null; S.editing=null; S.pane=null; S.renaming=false; S.web=S.set.webDefault; S.browser=false; S.routing=S.set.bias; if(!wide(820)) S.side=false; renderApp(); $('#ta').focus(); break;
    case 'search': S.searching=true; renderSide(); $('#chatq').focus(); break;
    case 'files': showFiles(); break;
    case 'skills': openSkills(); break;
    case 'close-pane': S.pane=null; renderPane(); break;
    case 'why-last': { const n=lastA(); if(n){ S.open['w'+n.id]=true; S.stick=false; renderThread(); const el=document.getElementById('md-'+n.id); if(el) el.parentNode.scrollIntoView({block:'end',behavior:'smooth'}); } break; }
    case 'send': send(false); break;
    case 'stop': stop(); break;
    case 'skip-review': if(S.run){ S.run.skip=true; S.run.review=null; refreshLive(); } break;
    case 'edit-cancel': S.editing=null; renderThread(); break;
    case 'edit-save': { const c=conv(), n=c.nodes[d.id], v=$('#editta').value.trim(); if(!v||S.run) return; S.editing=null; run(c,add(c,n.parent,{role:'u',content:v,atts:n.atts})); break; }
    case 'clar-send': { const q=S.clar; q.qs.forEach(x=>{ if(x.k==='text'){ const el=document.querySelector(`[data-cltext="${x.id}"]`); if(el) q.draft[x.id]=el.value; } }); answerClar(Object.entries(q.draft).filter(([,v])=>Array.isArray(v)?v.length:(v||'').trim()).map(([id,v])=>({id,v}))); break; }
    case 'clar-skip': answerClar([]); break;
    case 'bv-take': S.bv.human=true; renderPane(); break;
    case 'bv-back': S.bv.human=false; renderPane(); break;
    case 'bv-pause': S.bv.paused=!S.bv.paused; renderPane(); break;
    case 'bv-stop': S.bv=null; S.pane=S.prevPane||null; renderPane(); toast('Browser stopped. The run continues.'); break;
    case 'close-modal': closeModal(); break;
    case 'keys': closeModal(); openKeys(); break;
    case 'upgrade': closeModal(); openUpgrade(); break;
    case 'signout': toast('Sign out is off in this preview'); break;
    case 'clear-all': closeModal(); stop(); S.convs=[]; S.active=null; S.pane=null; renderApp(); toast('All chats deleted'); break;
    case 'sub': S.usage.plan='Pro'; S.usage.limit=200; remodal(); renderSide(); toast('You are on Pro'); break;
    case 'unsub': S.usage.plan='Free'; S.usage.limit=20; remodal(); renderSide(); break;
    case 'sync': toast('Settings encrypted with your passphrase and synced'); break;
    case 'copy-code': copy(S.hcode.code,'Code copied'); break;
    case 'new-code': S.hcode=code8(); remodal(); break;
    case 'ctx-ok': closeModal(); send(d.fast==='1',true); break;
    case 'download': toast('Cascade picks the build for your computer here.'); break;
    case 'copy-npm': copy('npm i -g cascade-ai'); break;
    case 'doc-nav': S.docNav=!S.docNav; $('#dnav').classList.toggle('open',S.docNav); break;
    case 'doc-search': openDocSearch(); break;
    case 'copy-page': { const p=doc(S.docPage); copy('# '+p.title+'\n\n'+p.md,'Page copied as Markdown'); break; }
    case 'copy-tokens': copy(TOKENS,'Tokens copied'); break;
  } });
document.addEventListener('submit',e=>{ if(e.target.id==='rename'){ e.preventDefault(); const c=conv(), v=$('#renamein').value.trim(); if(c&&v) c.title=v; S.renaming=false; renderHead(); renderSide(); } });
document.addEventListener('input',e=>{ const t=e.target; if(t.id==='ta'){ S.draft=t.value; size(t); renderSend(); } if(t.id==='chatq'){ S.q=t.value; $('#convs').innerHTML=convRows(); paint(); } if(t.dataset.cltext&&S.clar) S.clar.draft[t.dataset.cltext]=t.value; });
document.addEventListener('change',e=>{ const t=e.target; if(t.id==='fileinput'){ addFiles(t.files); t.value=''; } if(t.id==='importinput'){ if(t.files[0]) importFile(t.files[0]); t.value=''; } if(t.dataset.memkind) S.memories.find(m=>m.id===t.dataset.memkind).kind=t.value; if(t.dataset.setin){ const v=t.value.trim(); if(t.dataset.setin==='costCap'&&v&&!(+v>=.05&&+v<=25)){ t.value=S.set.costCap; return toast('Use a cap between $0.05 and $25.'); } S.set[t.dataset.setin]=v; toast('Saved'); } });
document.addEventListener('keydown',e=>{ const t=e.target;
  if(t.id==='ta'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); send(false); }
  if(t.id==='editta'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); $('[data-act="edit-save"]').click(); }
  if(t.id==='chatq'&&e.key==='Escape'){ S.searching=false; S.q=''; renderSide(); }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); if(S.view==='docs') openDocSearch(); else if(S.view==='app'){ S.side=true; S.searching=true; renderSide(); $('#chatq').focus(); } }
  if(e.key==='Escape'){ if(S.menu) closeMenu(); else if(S.modal) closeModal(); else if(S.renaming){ S.renaming=false; renderHead(); } } });
document.addEventListener('paste',e=>{ if(e.target.id!=='ta') return; const f=Array.from(e.clipboardData.files||[]); if(f.length){ e.preventDefault(); addFiles(f); } });
document.addEventListener('dragover',e=>{ const c=e.target.closest&&e.target.closest('#composer'); if(c){ e.preventDefault(); c.classList.add('drag'); } });
document.addEventListener('dragleave',e=>{ const c=e.target.closest&&e.target.closest('#composer'); if(c) c.classList.remove('drag'); });
document.addEventListener('drop',e=>{ const c=e.target.closest&&e.target.closest('#composer'); if(c){ e.preventDefault(); c.classList.remove('drag'); if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files); } });
document.addEventListener('scroll',e=>{ if(e.target.id==='scroll'){ const s=e.target; S.stick=s.scrollHeight-s.scrollTop-s.clientHeight<80; } },true);
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ closeMenu(); renderSide(); renderHead(); },120); });

seed(); render();
</script>
