name: PR248 round27 restore hardening

on:
  push:
    branches: [claude/desktop-app-features-j8qfoj]
    paths: [.github/workflows/pr248-round27-hardening.yml]

permissions:
  contents: write

jobs:
  harden-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/desktop-app-features-j8qfoj
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Harden failed temporary restore
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old, new, 1)

          p = Path('src/browser/remote/controller.ts')
          s = p.read_text()
          s = once(
              s,
              "      if (held.hiddenByHolder === true && !held.screencast) {\n",
              "      if ((held.hiddenByHolder === true || held.visibilityUnconfirmed === true) && !held.screencast) {\n",
              'retryable detached restore condition',
          )
          s = once(
              s,
              "        if (held.screencast === cdp && held.onFrame === sink && held.watchGen === watchGen) {\n",
              "        if (\n          held.screencast === cdp\n          && held.onFrame === sink\n          && held.watchGen === watchGen\n          && held.hiddenByHolder === false\n          && held.visibilityUnconfirmed === false\n          && held.capturing === true\n        ) {\n",
              'cleanup only confirmed temporary restore',
          )
          s = once(
              s,
              "        // underneath it. Otherwise this was only a one-action visibility proof.\n",
              "        // underneath it. A failed or timed-out restore is kept attached but\n        // stopped: that state is retryable by the next action and must not be\n        // advertised as visible. Only a confirmed successful restore was a\n        // one-action visibility proof that is safe to tear back down.\n",
              'temporary restore cleanup comment',
          )
          p.write_text(s)

          p = Path('src/browser/remote/controller.test.ts')
          s = p.read_text()
          s = once(
              s,
              "let cdpPerAttach = false;\n",
              "let cdpPerAttach = false;\n/** Make newly-created per-attach sessions start without producing a frame. */\nlet silentNewCdp = false;\n",
              'silent cdp test flag',
          )
          s = once(
              s,
              "      if (cdpPerAttach) { cdp = fakeCdp(); cdpSessions.push(cdp); }\n",
              "      if (cdpPerAttach) {\n        cdp = fakeCdp();\n        cdp.silentStart = silentNewCdp;\n        cdpSessions.push(cdp);\n      }\n",
              'silent per-attach cdp setup',
          )
          s = once(
              s,
              "  cdpPerAttach = false;\n  cdpSessions.length = 0;\n",
              "  cdpPerAttach = false;\n  silentNewCdp = false;\n  cdpSessions.length = 0;\n",
              'silent cdp reset',
          )

          marker = "  it('keeps a deliberate pause private across handback and a later watch', async () => {"
          if s.count(marker) != 1:
              raise SystemExit('failed restore test marker mismatch')
          test = """  it('keeps a failed detached restore paused and retryable', async () => {\n    cdpPerAttach = true;\n    const { provider } = fakeProvider();\n    const c = new RemoteBrowserController({ provider });\n    await c.controller({ kind: 'click', selector: '#a' }, ctx('run-A', 'w1'));\n\n    const frames: BrowserFrame[] = [];\n    await c.startWatching('run-A', (f) => frames.push(f));\n    const first = cdpSessions[0]!;\n    first.pushFrame(1);\n    c.frameSeen('run-A', frames[0]!.generation);\n    c.actorEnded('w1');\n    await c.takeOver('run-A');\n    expect(await c.setCapture('run-A', false)).toBe(false);\n    expect(c.handBack('run-A')).toBe(true);\n    await c.stopWatching('run-A');\n\n    vi.useFakeTimers();\n    try {\n      silentNewCdp = true;\n      const acting = c.controller({ kind: 'click', selector: '#must-wait-for-picture' }, ctx('run-A', 'w2'));\n      for (let i = 0; i < 10 && cdpSessions.length < 2; i++) await Promise.resolve();\n      expect(cdpSessions).toHaveLength(2);\n      const restore = cdpSessions[1]!;\n\n      await vi.advanceTimersByTimeAsync(2_100);\n      const refused = await acting;\n      expect(refused.ok, 'no frame means no page mutation').toBe(false);\n      expect(page.calls).not.toContain('click:#must-wait-for-picture');\n      expect(restore.detached, 'a failed restore remains attached but stopped for retry').toBe(false);\n\n      restore.silentStart = false;\n      silentNewCdp = false;\n      const retry = await c.controller({ kind: 'click', selector: '#after-picture' }, ctx('run-A', 'w2'));\n      expect(retry.ok).toBe(true);\n      expect(page.calls).toContain('click:#after-picture');\n      expect(cdpSessions, 'retry reuses the paused session instead of bypassing it').toHaveLength(2);\n    } finally {\n      vi.useRealTimers();\n    }\n  });\n\n"""
          s = s.replace(marker, test + marker, 1)
          p.write_text(s)
          PY

      - name: Controller regressions
        run: npx vitest run src/browser/remote/controller.test.ts
      - name: TypeScript checks
        run: npm run lint

      - name: Commit hardening and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr248-round27-hardening.yml
          git add src/browser/remote/controller.ts src/browser/remote/controller.test.ts
          git commit -m 'fix(browser): keep failed detached restores retryable'
          git push origin HEAD:claude/desktop-app-features-j8qfoj
