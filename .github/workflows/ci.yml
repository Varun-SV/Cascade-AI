# Runs the test suites, typechecks and builds on every pull request.
#
# Until this existed the only PR checks were CodeQL's security analysis, so a
# pull request could show all-green with a failing test suite — which is exactly
# what happened: a PR sat green for hours while one of its own new tests failed.
# CodeQL answers "is this code dangerous"; nothing answered "does this code
# work". This is that second check.
#
# NOTE: a passing workflow does not block a merge on its own. To make it a real
# gate, mark "SDK, CLI & desktop" and "Cloud server & web" as required status
# checks in the repository's branch-protection rules for `main`.
name: CI

on:
  # NO `branches` filter here, deliberately. It used to be `branches: [main]`,
  # which silently skipped CI for any pull request based on another branch —
  # and this repo stacks PRs (open B against A so B's diff shows only its own
  # work, then retarget B to main once A merges). Such a PR showed ZERO checks
  # rather than a failure, which reads as "not run yet" and is easy to merge
  # past. Retargeting does not rescue it either: base changes arrive as
  # `edited`, which is not in the default type list, so nothing re-fires.
  #
  # Running CI on every PR regardless of base costs one extra run per stacked
  # PR and removes a whole class of "green because nothing ran".
  pull_request:
    # `ready_for_review` is added because a PR opened as a draft and later
    # marked ready should be re-checked at that moment; the default types
    # (opened / synchronize / reopened) do not include it.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
  workflow_dispatch: {}

# Least privilege: checking out and running the suites needs nothing but read
# access to the repo contents. Without this block the job inherits whatever the
# repository default is — which can be read/write — and a workflow that executes
# a pull request's own code (npm ci runs its install scripts, vitest runs its
# tests) is exactly where a write-capable token should not be sitting.
# release.yml declares `contents: write` because it genuinely publishes; this
# one has no reason to write anything.
permissions:
  contents: read

# A new push to the same PR makes the previous run's answer irrelevant, so stop
# it rather than paying for two. Never cancel on main: those runs are the record
# of whether a merged commit was green.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    name: SDK, CLI & desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22 to match release.yml — optional native deps (isolated-vm) ship
          # prebuilds for the Node 22/24 ABIs only.
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Typecheck before tests: a type error is the cheapest failure to read,
      # and vitest transpiles without checking types, so a broken signature can
      # otherwise sail through a green test run.
      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (web + CLI)
        run: npm run build

      # Kept in this job, after the CLI build: the desktop main process compiles
      # against the built core, so it needs `dist/` to exist. release.yml builds
      # them in this same order for the same reason.
      - name: Build desktop app
        run: npm run build -w app

  cloud:
    name: Cloud server & web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # cloud/server imports the SDK through a vendored `#cascade-ai` bundle
      # that is GENERATED, not committed (.gitignore: cloud/server/vendor/), so
      # on a clean checkout nothing it imports resolves — every src file fails
      # with TS2307 and vitest cannot load the suite either.
      #
      # This is the workspace's own `prebuild` wiring, not a bespoke CI step:
      # `npm run build -w cascade-cloud-server` triggers prebuild, which runs
      # the root `build:cli` and then scripts/link-cascade-ai.mjs to write the
      # vendor file — and then tsup, so the server build gets covered too.
      - name: Build SDK core + vendored bundle (server prebuild)
        run: npm run build -w cascade-cloud-server

      # cloud/server has no `lint` script of its own; its typecheck is a direct
      # tsc against its tsconfig, matching what the workspace docs describe.
      - name: Server typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: cloud/server

      - name: Server tests
        run: npm test -w cascade-cloud-server

      - name: Web tests
        run: npm test -w cascade-cloud-web

      # `build` here is `tsc && vite build`, so this typechecks the SPA too.
      - name: Web build
        run: npm run build -w cascade-cloud-web

  # The self-host path is a supported deployment surface, so it gets built and
  # booted rather than assumed. Nothing else in this workflow touches the
  # Dockerfile: the other two jobs run the build commands directly, which
  # verifies the code compiles but says nothing about whether the image the
  # README tells people to run actually assembles and starts. A COPY pointing at
  # a path that stopped existing is the classic way that diverges silently, and
  # it would reach users rather than CI.
  docker:
    name: Self-host image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t cascade-selfhost:ci .

      - name: Boot it
        # Loopback publish mirrors docker-compose.yml. DATA_DIR is set to the
        # same path the compose volume mounts, so this exercises the real
        # runtime layout rather than a container-default one.
        run: |
          docker run -d --name cascade-ci \
            -p 127.0.0.1:8787:8787 \
            -e SESSION_SECRET="ci-session-secret-not-a-real-one" \
            -e DATA_DIR=/data \
            cascade-selfhost:ci

      - name: Wait for /health
        # Polls rather than sleeping a fixed amount: a fixed sleep is either
        # flaky when the runner is slow or wasted time when it is fast.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health > /tmp/health.json 2>/dev/null; then
              echo "healthy after ${i}s: $(cat /tmp/health.json)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server never became healthy"
          docker logs cascade-ci
          exit 1

      - name: Serves the built web UI
        # The image is only useful if the SPA made it in — the server serves
        # cloud/web/dist only when that directory exists, so a build stage that
        # silently skipped the web build would still pass /health.
        run: |
          code=$(curl -s -o /tmp/index.html -w '%{http_code}' http://127.0.0.1:8787/)
          test "$code" = "200" || { echo "::error::GET / returned $code"; docker logs cascade-ci; exit 1; }
          grep -qi '<div id="root"' /tmp/index.html \
            || { echo "::error::GET / did not return the built SPA shell"; head -c 400 /tmp/index.html; exit 1; }
          echo "SPA shell served"

      - name: Container logs
        if: always()
        run: docker logs cascade-ci || true
