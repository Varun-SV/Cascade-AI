name: PR248 round25 follow-up

on:
  push:
    branches: [claude/desktop-app-features-j8qfoj]
    paths:
      - .github/workflows/pr248-round25-fix.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/desktop-app-features-j8qfoj
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply review fixes and regressions
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          # --- Controller: privacy intent survives watch/hold lifecycle; explicit
          # capture decisions use the non-expiring human FIFO; failed CDP starts
          # remain eligible for the provider fallback viewer.
          p = Path('src/browser/remote/controller.ts')
          s = p.read_text()
          s = replace_once(s,
          '''   * Cleared where capture actually turns back ON, which is the one place both
           * routes out of the pause meet: the person pressing Show, and the agent
           * restoring the picture before it touches the page once the hold has ended.
           * Only honoured while they still hold it, so a pause cannot outlive its
           * holder and leave a later viewer looking at nothing.
           */''',
          '''   * Cleared where capture actually turns back ON, which is the one place both
           * routes out of the pause meet: the person pressing Show, and the agent
           * restoring the picture before it touches the page once the hold has ended.
           * The privacy decision deliberately survives the hold itself: handback or
           * idle expiry gives the agent permission to continue, but does not put a
           * hidden credential page back on the wire. The agent's visibility gate is
           * what clears it immediately before the next mutation.
           */''', 'hiddenByHolder comment')

          old_attach = '''    // A watcher coming back does not undo a deliberate Hide. The session is
              // attached either way — so Show, and the agent's own restore, have
              // something to turn on — but the stream stays stopped until somebody asks
              // for it. Only while the person still holds the page: a pause with no
              // holder left is nobody's decision, and honouring it would leave the panel
              // dark with nothing to clear it.
              const paused = held.hiddenByHolder === true && this.humanHolds(runId);
              if (!paused) {
                try {
                  await cdp.send('Page.startScreencast', { ...SCREENCAST });
                } catch {
                  // The page went away between opening the session and starting the
                  // stream. Leave nothing half-attached behind.
                  await cdp.detach().catch(() => {});
                  return null;
                }
              }
          '''
          new_attach = '''    // A watcher coming back does not undo a deliberate Hide. The session is
              // attached either way — so Show, and the agent's own restore, have
              // something to turn on — but the stream stays stopped until one of those
              // explicit restore paths asks for it. This remains true after handback or
              // idle expiry: ending ownership permits the agent to continue, it does not
              // itself consent to putting a credential page back on the wire. The next
              // agent action restores visibility before it mutates the page.
              const paused = held.hiddenByHolder === true;
              if (!paused) {
                try {
                  await cdp.send('Page.startScreencast', { ...SCREENCAST });
                } catch {
                  // This was an ordinary watch, not a privacy pause. If CDP cannot
                  // start, do not leave `capturing: false`: the web client interprets
                  // false as "deliberately hidden" and would suppress a provider
                  // fallback viewer that may still work. `startWatching` returning
                  // false says the CDP stream failed; capture state says it is safe to
                  // use another view of the page.
                  held.visibilityUnconfirmed = false;
                  held.capturing = true;
                  this.announceControl(runId);
                  await cdp.detach().catch(() => {});
                  return null;
                }
              }
          '''
          s = replace_once(s, old_attach, new_attach, 'attach pause/fallback')
          s = replace_once(s,
              '''    const token = await lease.acquireActionSlot();
              if (!token) return held.capturing === true;''',
              '''    // Hide/Show are explicit human decisions, just like committed text.
              // Once accepted into the FIFO they must not evaporate merely because a
              // prior CDP action took longer than the generic two-second slot budget.
              const token = await lease.acquireActionSlot(null);
              if (!token) return held.capturing === true;''',
              'capture FIFO')
          p.write_text(s)

          # --- Web view: React 19 delegates wheel with passive listeners. A native
          # non-passive listener prevents the local chat from scrolling while the same
          # gesture is being forwarded to the remote page.
          p = Path('cloud/web/src/chat/BrowserLiveView.tsx')
          s = p.read_text()
          s = replace_once(s,
              '''  const watchable = !!frame || (!!liveViewUrl && !paused);''',
              '''  const hasFrame = frame !== undefined;
              const watchable = hasFrame || (!!liveViewUrl && !paused);''',
              'hasFrame')
          s = replace_once(s,
              '''  useEffect(() => {
                if (blind) keyboardRef.current?.focus();
              }, [blind]);
          ''',
              '''  useEffect(() => {
                if (blind) keyboardRef.current?.focus();
              }, [blind]);

              // React 19's delegated wheel listener is passive, so calling
              // preventDefault from `onWheel` cannot stop the surrounding chat from
              // scrolling. While the person is driving, install one native non-passive
              // listener on the actual picture solely to consume the local default.
              // React's handler still receives the event and forwards its delta to CDP.
              useEffect(() => {
                if (!active || !driving || !hasFrame) return;
                const img = imgRef.current;
                if (!img) return;
                const keepWheelRemote = (event: WheelEvent) => event.preventDefault();
                img.addEventListener('wheel', keepWheelRemote, { passive: false });
                return () => img.removeEventListener('wheel', keepWheelRemote);
              }, [active, driving, hasFrame]);
          ''', 'native wheel hook')
          p.write_text(s)

          # --- Controller regressions. Round 24 had a test asserting the opposite
          # privacy policy; make it describe the actual invariant now, and add the CDP
          # failure/fallback distinction.
          p = Path('src/browser/remote/controller.test.ts')
          s = p.read_text()
          start = s.index("  it('does not leave a pause standing that its holder no longer owns'")
          end = s.index("\n  it('refuses hidden typing from a watcher that arrived after the page was hidden'", start)
          replacement = '''  it('keeps a deliberate pause private across handback and a later watch', async () => {
              // Handback ends exclusive ownership; it is not consent to put a hidden
              // credential page back on the wire. A later watcher stays paused until
              // Show or the agent's pre-action visibility gate explicitly restores it.
              const { provider } = fakeProvider();
              const c = new RemoteBrowserController({ provider });
              await c.controller({ kind: 'click', selector: '#a' }, ctx('run-A', 'w1'));

              const first: BrowserFrame[] = [];
              await c.startWatching('run-A', (f) => first.push(f));
              cdp.pushFrame(1);
              c.frameSeen('run-A', first[0]!.generation);
              c.actorEnded('w1');
              await c.takeOver('run-A');
              await c.setCapture('run-A', false);

              expect(c.handBack('run-A')).toBe(true);
              await c.stopWatching('run-A');
              const started = cdp.sent.filter((m) => m === 'Page.startScreencast').length;

              await c.startWatching('run-A', () => {});
              expect(
                cdp.sent.filter((m) => m === 'Page.startScreencast'),
                'rewatching does not disclose the page merely because ownership ended',
              ).toHaveLength(started);
              expect(c.humanHolds('run-A'), 'the hold really did end').toBe(false);
            });

            it('keeps provider fallback available when a normal screencast start fails', async () => {
              const { provider } = fakeProvider('https://provider.test/live/abc');
              const c = new RemoteBrowserController({ provider });
              const states: Array<{ capturing: boolean }> = [];
              await c.controller({ kind: 'click', selector: '#a' }, ctx('run-A', 'w1'));
              c.onControlFor('run-A', (state) => states.push({ capturing: state.capturing }));

              await c.startWatching('run-A', () => {});
              await c.stopWatching('run-A');
              expect(states.at(-1)?.capturing, 'an unwatch is not itself a privacy decision').toBe(false);

              const realSend = cdp.send;
              cdp.send = async (method: string, params?: Record<string, unknown>) => {
                if (method === 'Page.startScreencast') throw new Error('screencast unavailable');
                return realSend.call(cdp, method, params);
              };
              try {
                expect(await c.startWatching('run-A', () => {}), 'CDP really did fail').toBe(false);
              } finally {
                cdp.send = realSend;
              }
              expect(
                states.at(-1)?.capturing,
                'but failure is not advertised as a deliberate hidden page',
              ).toBe(true);
            });
          '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # --- BrowserLiveView tests: migrate keyboard assertions to the editable
          # sink that production now uses for layout/dead-key/IME correctness.
          p = Path('cloud/web/src/chat/BrowserLiveView.test.tsx')
          s = p.read_text()

          def replace_test(name, next_name, body):
              global s
              start = s.index(f"  it('{name}'")
              end = s.index(f"\n  it('{next_name}'", start)
              s = s[:start] + body.rstrip() + '\n' + s[end:]

          replace_test(
              "becomes drivable once the server says the page is the user\\'s",
              "leaves the viewer\\'s own shortcuts alone",
              r'''  it('becomes drivable once the server says the page is the user\'s', () => {
              const onInput = vi.fn();
              render(
                <BrowserLiveView active liveViewUrl={undefined} frame={frame} human onStop={() => {}} onInput={onInput} />,
              );
              const img = screen.getByRole('img');
              const keyboard = screen.getByLabelText(/type into the agent browser/i) as HTMLTextAreaElement;
              expect(img, 'the picture itself is not the text boundary').toHaveAttribute('tabindex', '-1');

              fireEvent.mouseDown(img, { button: 0 });
              expect(keyboard, 'clicking the picture moves keyboard focus to the editable sink').toHaveFocus();
              fireEvent.input(keyboard, { target: { value: 'a' } });
              fireEvent.keyDown(keyboard, { key: 'Enter' });
              expect(onInput.mock.calls.map((c) => c[0])).toEqual([
                { kind: 'text', text: 'a' },
                { kind: 'key', key: 'Enter' },
              ]);
            });''')

          replace_test(
              "leaves the viewer\\'s own shortcuts alone",
              "survives a browser becoming active on a panel already mounted",
              r'''  it('leaves the viewer\'s own shortcuts alone', () => {
              const onInput = vi.fn();
              render(
                <BrowserLiveView active liveViewUrl={undefined} frame={frame} human onStop={() => {}} onInput={onInput} />,
              );
              const keyboard = screen.getByLabelText(/type into the agent browser/i);
              fireEvent.keyDown(keyboard, { key: 'r', ctrlKey: true });
              fireEvent.keyDown(keyboard, { key: 'w', metaKey: true });
              expect(onInput).not.toHaveBeenCalled();
            });

            it('forwards only text committed by the local input method', () => {
              const onInput = vi.fn();
              render(
                <BrowserLiveView active liveViewUrl={undefined} frame={frame} human onStop={() => {}} onInput={onInput} />,
              );
              const keyboard = screen.getByLabelText(/type into the agent browser/i) as HTMLTextAreaElement;
              fireEvent.input(keyboard, { target: { value: 'に' }, isComposing: true });
              expect(onInput, 'an IME candidate is not remote text yet').not.toHaveBeenCalled();
              fireEvent.input(keyboard, { target: { value: '日本' }, isComposing: false });
              expect(onInput).toHaveBeenCalledWith({ kind: 'text', text: '日本' });
            });

            it('refuses shifted commands rather than degrading them', () => {
              const onInput = vi.fn();
              render(
                <BrowserLiveView active liveViewUrl={undefined} frame={frame} human onStop={() => {}} onInput={onInput} />,
              );
              const keyboard = screen.getByLabelText(/type into the agent browser/i);
              fireEvent.keyDown(keyboard, { key: 'Tab', shiftKey: true });
              fireEvent.keyDown(keyboard, { key: 'ArrowLeft', shiftKey: true });
              expect(onInput).not.toHaveBeenCalled();
            });''')

          # Focus belongs to the stable editable sink, not the visible placeholder.
          old = '''    const surface = screen.getByRole('group', { name: /picture hidden/i });
              expect(surface, 'it takes focus when it appears').toHaveFocus();'''
          new = '''    const keyboard = screen.getByLabelText(/type into the agent browser/i);
              expect(keyboard, 'the editable sink takes focus when the blind period appears').toHaveFocus();'''
          s = replace_once(s, old, new, 'focus test')

          # Paste is received by the same editable sink in visible and blind states.
          s = replace_once(s,
              '''    fireEvent.paste(screen.getByRole('img'), {
                clipboardData: { getData: () => 'correct horse battery staple' },
              });''',
              '''    fireEvent.paste(screen.getByLabelText(/type into the agent browser/i), {
                clipboardData: { getData: () => 'correct horse battery staple' },
              });''', 'visible paste')
          s = replace_once(s,
              '''    fireEvent.paste(screen.getByRole('group', { name: /picture hidden/i }), {
                clipboardData: { getData: () => 'hunter2' },
              });''',
              '''    fireEvent.paste(screen.getByLabelText(/type into the agent browser/i), {
                clipboardData: { getData: () => 'hunter2' },
              });''', 'blind paste')

          # Hidden-page typing: visible group remains explanatory/pointer-inert;
          # committed text and commands go through the textarea.
          old = '''    const surface = screen.getByRole('group', { name: /picture hidden/i });
              expect(surface, 'and focus followed it').toHaveFocus();

              fireEvent.keyDown(surface, { key: 'h' });
              fireEvent.keyDown(surface, { key: 'Enter' });'''
          new = '''    expect(screen.getByRole('group', { name: /picture hidden/i })).toBeInTheDocument();
              const keyboard = screen.getByLabelText(/type into the agent browser/i) as HTMLTextAreaElement;
              expect(keyboard, 'and keyboard focus followed the hidden picture').toHaveFocus();

              fireEvent.input(keyboard, { target: { value: 'h' } });
              fireEvent.keyDown(keyboard, { key: 'Enter' });'''
          s = replace_once(s, old, new, 'hidden typing')

          old = '''    const chosen = screen.getByRole('group', { name: /picture hidden/i });
              fireEvent.keyDown(chosen, { key: 'p' });
              expect(onInput).toHaveBeenCalledWith({ kind: 'text', text: 'p' });'''
          new = '''    expect(screen.getByRole('group', { name: /picture hidden/i })).toBeInTheDocument();
              const keyboard = screen.getByLabelText(/type into the agent browser/i) as HTMLTextAreaElement;
              fireEvent.input(keyboard, { target: { value: 'p' } });
              expect(onInput).toHaveBeenCalledWith({ kind: 'text', text: 'p' });'''
          s = replace_once(s, old, new, 'confirmed inherited typing')

          # Add a regression for the React-19 passive-wheel failure.
          marker = "  it('sums the wheel distance it did not send yet', async () => {"
          wheel_test = r'''  it('keeps a remote wheel gesture from scrolling the local chat', () => {
              const onInput = vi.fn();
              render(
                <BrowserLiveView active liveViewUrl={undefined} frame={frame} human onStop={() => {}} onInput={onInput} />,
              );
              const img = screen.getByRole('img') as HTMLImageElement;
              const wheel = new WheelEvent('wheel', { bubbles: true, cancelable: true, deltaY: 120 });
              fireEvent(img, wheel);
              expect(wheel.defaultPrevented, 'the gesture belongs to the remote page while driving').toBe(true);
            });

          '''
          if marker not in s:
              raise SystemExit('wheel test marker missing')
          s = s.replace(marker, wheel_test + marker, 1)

          p.write_text(s)
          PY
      - name: Controller regressions
        run: npx vitest run src/browser/remote/controller.test.ts
      - name: Full cloud web unit suite
        run: npm run test -w cascade-cloud-web
      - name: Cloud web typecheck and build
        run: npm run build -w cascade-cloud-web
      - name: Commit fixes and remove helper workflow
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr248-round25-fix.yml
          git add src/browser/remote/controller.ts src/browser/remote/controller.test.ts cloud/web/src/chat/BrowserLiveView.tsx cloud/web/src/chat/BrowserLiveView.test.tsx
          git commit -m "fix(browser): address takeover review follow-ups"
          git push origin HEAD:claude/desktop-app-features-j8qfoj
