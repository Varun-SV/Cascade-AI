name: PR248 round26 review fixes v2

on:
  push:
    branches: [claude/desktop-app-features-j8qfoj]
    paths:
      - .github/workflows/pr248-round26-fix-v2.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/desktop-app-features-j8qfoj
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply guarded round 26 fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def one(text: str, old: str, new: str, label: str) -> str:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old, new, 1)

          def replace_test(text: str, name: str, next_name: str, body: str) -> str:
              start = text.index(f"  it('{name}'")
              end = text.index(f"\n  it('{next_name}'", start)
              return text[:start] + body.rstrip() + '\n' + text[end:]

          # ── Controller production fixes ────────────────────────────────────
          p = Path('src/browser/remote/controller.ts')
          s = p.read_text()

          start = s.index('  /** Nobody is watching any more: stop paying to render frames. */')
          end = s.index('\n  /**\n   * Suspend or resume the picture without giving up control.', start)
          stop_fn = '''  /** Nobody is watching any more: stop paying to render frames. */
          async stopWatching(runId: string): Promise<void> {
            const held = this.runs.get(runId);
            if (!held) return;
            await this.queueWatch(held, async () => {
              const cdp = held.screencast;
              // Invalidate the VIEW before waiting. Events already queued behind
              // the one that is landing must fail their post-wait identity check
              // rather than target a page the viewer has left.
              held.onFrame = undefined;
              if (!cdp) return;
              held.screencast = undefined;
              held.capturing = false;
              this.announceControl(runId);

              // Invalidation and teardown are deliberately separate. A click is
              // several CDP commands under one action slot; detaching between its
              // press and release reintroduces a partial human action. Wait for
              // the active turn to finish, but keep teardown bounded if CDP is
              // genuinely wedged.
              const lease = this.leases.get(runId);
              const token = lease ? await lease.acquireActionSlot(ACTION_TIMEOUT_MS) : null;
              try {
                await cdp.send('Page.stopScreencast').catch(() => {});
                await cdp.detach().catch(() => {});
              } finally {
                if (token && lease) lease.endAction(token);
              }
            });
          }
          '''
          s = s[:start] + stop_fn.rstrip() + s[end:]

          old = '''      // SHOW re-reads the session; HIDE keeps the one it was aimed at.
                const target = on ? held.screencast : cdp;
                if (!target) return held.capturing === true;
                const now = await this.applyCapture(runId, held, target, on);'''
          new = '''      // SHOW re-reads the session; HIDE keeps the one it was aimed at.
                const target = on ? held.screencast : cdp;
                if (!target) {
                  // Show ends a RUN-level pause. An unwatch may invalidate its
                  // old session while this call waits; keep the decision so a
                  // replacement watch attaches visible instead of resurrecting
                  // the privacy pause the person just ended.
                  if (on) {
                    held.hiddenByHolder = false;
                    if (lease.heldByHuman) lease.touch();
                  }
                  return held.capturing === true;
                }
                const now = await this.applyCapture(runId, held, target, on);'''
          s = one(s, old, new, 'remember Show across unwatch')

          a = s.index('  private async applyCapture(')
          b = s.index('\n  /**\n   * Wait, briefly, for Chrome to produce a frame.', a)
          apply_fn = '''  private async applyCapture(
            runId: string,
            held: RunBrowser,
            cdp: CDPSession,
            on: boolean,
            confirmWithFrame = false,
          ): Promise<boolean> {
            if (held.capturing === on && !(on && confirmWithFrame && held.visibilityUnconfirmed)) return on;

            // Chrome may emit the first frame before startScreencast resolves.
            // Arm the confirmation flag before the command so that frame can
            // promote capture instead of being lost and then overwritten by a
            // late post-await flag write.
            const confirmRestore = on && confirmWithFrame;
            const wasUnconfirmed = held.visibilityUnconfirmed === true;
            const wasCapturing = held.capturing === true;
            if (confirmRestore) held.visibilityUnconfirmed = true;

            try {
              if (on) await cdp.send('Page.startScreencast', { ...SCREENCAST });
              else await cdp.send('Page.stopScreencast');
              if (on) {
                if (!confirmWithFrame) {
                  // Manual Show is allowed to return when the command is
                  // accepted; a later agent action still insists on a frame.
                  held.visibilityUnconfirmed = true;
                  held.capturing = true;
                }
                // For an agent restore, do not write visibilityUnconfirmed here:
                // an early frame may already have cleared it and promoted the
                // externally visible capture state.
              } else {
                held.visibilityUnconfirmed = false;
                held.capturing = false;
              }
              held.hiddenByHolder = !on;
              this.announceControl(runId);
            } catch {
              if (confirmRestore) {
                // A rejected restore must not inherit a transient promotion from
                // a frame that raced the rejected command.
                held.visibilityUnconfirmed = wasUnconfirmed;
                held.capturing = wasCapturing;
                this.announceControl(runId);
                return false;
              }
              return held.capturing === true && !held.visibilityUnconfirmed;
            }
            return on;
          }
          '''
          s = s[:a] + apply_fn.rstrip() + s[b:]
          p.write_text(s)

          # ── Web production fixes ───────────────────────────────────────────
          p = Path('cloud/web/src/chat/BrowserLiveView.tsx')
          s = p.read_text()
          marker = '''  /**
           * A paste, forwarded as the text it carries.'''
          helper = '''  /** Send sampled wheel distance before a later click. */
          const flushPendingScroll = () => {
            if (scrollTimerRef.current) {
              clearTimeout(scrollTimerRef.current);
              scrollTimerRef.current = null;
            }
            const total = pendingScrollRef.current;
            pendingScrollRef.current = null;
            if (!total) return;
            lastScrollRef.current = Date.now();
            onInput?.({ kind: 'scroll', ...total });
          };

          '''
          if s.count(marker) != 1:
              raise SystemExit(f'web helper marker mismatch: {s.count(marker)}')
          s = s.replace(marker, helper + marker, 1)
          s = one(s, '        {takeable && (', '        {(driving || takeable) && (', 'handback remains available')
          s = one(
              s,
              '''            const p = at(e.clientX, e.clientY);
                        if (p) onInput?.({ kind: 'click', ...p, button: e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left', clicks: e.detail || 1 });''',
              '''            const p = at(e.clientX, e.clientY);
                        if (p) {
                          // A sampled wheel event happened before this click.
                          // Deliver it now so its timer cannot reorder it after
                          // the later discrete action on the remote page.
                          flushPendingScroll();
                          onInput?.({ kind: 'click', ...p, button: e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left', clicks: e.detail || 1 });
                        }''',
              'flush wheel before click',
          )
          p.write_text(s)

          # ── Adapt two existing race tests to the stronger unwatch contract ─
          p = Path('src/browser/remote/controller.test.ts')
          s = p.read_text()

          stale_hide = '''  it('does not hide a session that stopped being the one on screen', async () => {
            cdpPerAttach = true;
            const { provider } = fakeProvider();
            const c = new RemoteBrowserController({ provider });
            await c.controller({ kind: 'click', selector: '#a' }, ctx('run-A', 'w1'));

            const first: BrowserFrame[] = [];
            await c.startWatching('run-A', (f) => first.push(f));
            const one = cdpSessions[0]!;
            one.pushFrame(1);
            c.frameSeen('run-A', first[0]!.generation);
            c.actorEnded('w1');
            await c.takeOver('run-A');

            const gate = deferred();
            const realSend = one.send;
            one.send = async (method: string, params?: Record<string, unknown>) => {
              if (method === 'Input.dispatchMouseEvent') await gate.promise;
              return realSend.call(one, method, params);
            };
            const clicking = c.input('run-A', { kind: 'click', x: 0.5, y: 0.5 });
            await new Promise((r) => setTimeout(r, 10));
            const hiding = c.setCapture('run-A', false);
            await new Promise((r) => setTimeout(r, 10));

            // Leaving the view invalidates it immediately, but teardown waits
            // until the multi-command click has finished using its CDP session.
            const stopping = c.stopWatching('run-A');
            await new Promise((r) => setTimeout(r, 10));
            expect(one.detached, 'the active click still owns the old session').toBe(false);

            gate.resolve();
            one.send = realSend;
            expect((await clicking).ok).toBe(true);
            await hiding; // aimed at the invalidated view, so it changes nothing.
            await stopping;
            expect(one.detached, 'detach happens only after the click completes').toBe(true);

            const second: BrowserFrame[] = [];
            await c.startWatching('run-A', (f) => second.push(f));
            const two = cdpSessions[1]!;
            expect(two, 'a replacement session really was attached').not.toBe(one);
            expect(two.sent.filter((m) => m === 'Page.stopScreencast'),
              'the replacement was never hidden by the stale request').toHaveLength(0);
            expect(c.humanHolds('run-A')).toBe(true);

            two.pushFrame(2);
            c.frameSeen('run-A', second[0]!.generation);
            expect(await c.setCapture('run-A', false), 'Hide works again once this watch is confirmed').toBe(false);
          });'''
          s = replace_test(
              s,
              'does not hide a session that stopped being the one on screen',
              'does not hide against a watch that was replaced while it waited',
              stale_hide,
          )

          show_test = '''  it('shows the page that is on screen now, not the one Show was aimed at', async () => {
            cdpPerAttach = true;
            const { provider } = fakeProvider();
            const c = new RemoteBrowserController({ provider });
            await watched(c);
            c.actorEnded('w1');
            await c.takeOver('run-A');
            await c.setCapture('run-A', false);

            const typing = deferred();
            const first = cdpSessions.at(-1)!;
            const realSend = first.send;
            first.send = async (method: string, params?: Record<string, unknown>) => {
              if (method === 'Input.insertText') await typing.promise;
              return realSend.call(first, method, params);
            };
            const typed = c.input('run-A', { kind: 'text', text: 'x' });
            await new Promise((r) => setTimeout(r, 10));
            const showing = c.setCapture('run-A', true);
            await new Promise((r) => setTimeout(r, 10));

            // Unwatch invalidates the old session while both calls are queued.
            // Show reaches the front before teardown and records a run-level
            // visible intent even though there is no current session yet.
            const stopping = c.stopWatching('run-A');
            await new Promise((r) => setTimeout(r, 10));
            typing.resolve();
            first.send = realSend;
            await typed;
            await showing;
            await stopping;

            await c.startWatching('run-A', () => {});
            const replacement = cdpSessions.at(-1)!;
            expect(replacement).not.toBe(first);
            expect(replacement.sent, 'the remembered Show makes the replacement visible')
              .toContain('Page.startScreencast');
          });'''
          s = replace_test(
              s,
              'shows the page that is on screen now, not the one Show was aimed at',
              'does not hand over a browser that closed while the person waited for it',
              show_test,
          )

          # Regression for the exact early-frame ordering from the review.
          marker = "  it('does not act on a page whose restore the user stopped', async () => {"
          early = '''  it('counts a restored frame that arrives before startScreencast resolves', async () => {
            const { provider } = fakeProvider();
            const c = new RemoteBrowserController({ provider });
            await watched(c);
            c.actorEnded('w1');
            await c.takeOver('run-A');
            await c.setCapture('run-A', false);
            c.handBack('run-A');

            const states: Array<{ capturing: boolean }> = [];
            c.onControlFor('run-A', (state) => states.push({ capturing: state.capturing }));
            cdp.silentStart = true;
            const start = deferred();
            const realSend = cdp.send;
            cdp.send = async (method: string, params?: Record<string, unknown>) => {
              if (method === 'Page.startScreencast') {
                const result = realSend.call(cdp, method, params);
                cdp.pushFrame(77);
                await start.promise;
                return result;
              }
              return realSend.call(cdp, method, params);
            };

            const acting = c.controller({ kind: 'click', selector: '#after-early-frame' }, ctx('run-A', 'w2'));
            await new Promise((r) => setTimeout(r, 10));
            start.resolve();
            const out = await acting;
            cdp.send = realSend;

            expect(out.ok, 'the early frame satisfies the visibility gate').toBe(true);
            expect(page.calls).toContain('click:#after-early-frame');
            expect(states.at(-1)?.capturing, 'the client is not left falsely paused').toBe(true);
          });

          '''
          if s.count(marker) != 1:
              raise SystemExit(f'early-frame test marker mismatch: {s.count(marker)}')
          s = s.replace(marker, early + marker, 1)
          p.write_text(s)

          # ── Web regressions ────────────────────────────────────────────────
          p = Path('cloud/web/src/chat/BrowserLiveView.test.tsx')
          s = p.read_text()
          marker = "  it('asks for the page rather than assuming it got it', () => {"
          handback = '''  it('keeps Give it back available when the stream disappears', () => {
            const onHandBack = vi.fn();
            render(
              <BrowserLiveView
                active liveViewUrl={undefined} frame={undefined} streaming={false} human
                onStop={() => {}} onHandBack={onHandBack}
              />,
            );
            fireEvent.click(screen.getByRole('button', { name: /give it back/i }));
            expect(onHandBack).toHaveBeenCalledOnce();
            expect(screen.queryByRole('button', { name: /take control/i })).not.toBeInTheDocument();
          });

          '''
          if s.count(marker) != 1:
              raise SystemExit('handback test marker mismatch')
          s = s.replace(marker, handback + marker, 1)

          marker = "  it('sums the wheel distance it did not send yet', async () => {"
          wheel = '''  it('flushes pending wheel distance before a later click', async () => {
            vi.useFakeTimers();
            const now = vi.spyOn(Date, 'now');
            try {
              const onInput = vi.fn();
              render(
                <BrowserLiveView active liveViewUrl={undefined} frame={frame} human onStop={() => {}} onInput={onInput} />,
              );
              const img = screen.getByRole('img') as HTMLImageElement;
              Object.defineProperty(img, 'naturalWidth', { value: 1280 });
              Object.defineProperty(img, 'naturalHeight', { value: 800 });
              img.getBoundingClientRect = () => ({ left: 0, top: 0, width: 400, height: 400 }) as DOMRect;

              now.mockReturnValue(1_000);
              fireEvent.wheel(img, { clientX: 200, clientY: 200, deltaY: 10, deltaMode: 0 });
              onInput.mockClear();
              now.mockReturnValue(1_010);
              fireEvent.wheel(img, { clientX: 200, clientY: 200, deltaY: 20, deltaMode: 0 });
              expect(onInput).not.toHaveBeenCalled();

              fireEvent.mouseDown(img, { clientX: 200, clientY: 200, button: 0, detail: 1 });
              expect(onInput.mock.calls.map((c) => c[0])).toEqual([
                { kind: 'scroll', x: 0.5, y: 0.5, deltaY: 20 },
                { kind: 'click', x: 0.5, y: 0.5, button: 'left', clicks: 1 },
              ]);
              await act(async () => { vi.advanceTimersByTime(SCROLL_INTERVAL); });
              expect(onInput, 'the cancelled timer does not replay the scroll after the click').toHaveBeenCalledTimes(2);
            } finally {
              now.mockRestore();
              vi.useRealTimers();
            }
          });

          '''
          if s.count(marker) != 1:
              raise SystemExit('wheel test marker mismatch')
          s = s.replace(marker, wheel + marker, 1)
          p.write_text(s)
          PY

      - name: Controller regressions
        run: npx vitest run src/browser/remote/controller.test.ts
      - name: Full cloud web unit suite
        run: npm test -w cascade-cloud-web
      - name: Cloud web build
        run: npm run build -w cascade-cloud-web

      - name: Commit fixes and remove helpers
        shell: bash
        run: |
          git rm .github/workflows/pr248-round26-fix.yml .github/workflows/pr248-round26-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/browser/remote/controller.ts src/browser/remote/controller.test.ts cloud/web/src/chat/BrowserLiveView.tsx cloud/web/src/chat/BrowserLiveView.test.tsx
          git commit -m "fix(browser): close takeover ordering races"
          git push origin HEAD:claude/desktop-app-features-j8qfoj
