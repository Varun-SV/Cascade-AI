# Refreshes the public-benchmark snapshot that Cascade Auto routes on.
# Re-aggregates the per-source files in scripts/benchmarks/sources/ (normalize
# each to 0-100, take the conservative lowest per family/task) — see
# docs/benchmark-aggregation.md. Runs weekly (and on demand). Opens a PR ONLY
# when the data actually changed. The PR touches data only (no version bump),
# so merging it does NOT trigger the release workflow.
name: Refresh benchmark snapshot

on:
  schedule:
    # Tuesdays 05:00 IST — which is Monday 23:30 UTC (IST = UTC+5:30), so the
    # PR is waiting for review first thing Tuesday morning.
    - cron: "30 23 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-benchmarks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # cron has no "start on this date" — it just recurs. This gate holds the
      # first scheduled run until START_DATE so the schedule can be committed
      # ahead of time. A manual `workflow_dispatch` always runs, so the pipeline
      # stays testable before then. Remove the gate once it's in steady state.
      - name: Hold until the scheduled start date
        id: gate
        env:
          START_DATE: "2026-08-03"
        run: |
          TODAY=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$TODAY" \< "$START_DATE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled runs begin $START_DATE (today is $TODAY) — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh snapshot
        if: steps.gate.outputs.skip == 'false'
        env:
          # Optional: set as a repo variable to merge an external quality source.
          BENCHMARK_SOURCE_URL: ${{ vars.BENCHMARK_SOURCE_URL }}
        run: node scripts/refresh-benchmarks.mjs

      - name: Detect changes
        if: steps.gate.outputs.skip == 'false'
        id: diff
        run: |
          if git diff --quiet -- src/core/router/benchmark-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot changes — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.gate.outputs.skip == 'false' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="chore/benchmark-refresh-$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/core/router/benchmark-data.json
          git commit -m "chore(data): refresh benchmark snapshot ($DATE)"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --title "chore(data): refresh benchmark snapshot ($DATE)" \
            --body "Automated refresh of \`src/core/router/benchmark-data.json\` (Cascade Auto routing scores), re-aggregated from \`scripts/benchmarks/sources/\` — each source normalized to 0-100, conservative (lowest) value per family/task. See \`docs/benchmark-aggregation.md\`. Data-only — no version bump, so this does not trigger a release." \
            --base main \
            --head "$BRANCH" || echo "PR may already exist for $BRANCH"
