name: PR248 round28 review fixes

on:
  push:
    branches:
      - claude/desktop-app-features-j8qfoj

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/desktop-app-features-j8qfoj
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply round 28 fixes
        run: python .github/scripts/pr248_round28.py
      - name: Controller regressions
        run: npx vitest run src/browser/remote/controller.test.ts
      - name: Full cloud web unit suite
        run: npm test -w cascade-cloud-web
      - name: Cloud web production build
        run: npm run build -w cascade-cloud-web
      - name: TypeScript checks
        run: npm run lint
      - name: Commit fixes and remove helpers
        shell: bash
        run: |
          rm .github/workflows/pr248-round28-fix.yml .github/scripts/pr248_round28.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/browser/remote/controller.ts src/browser/remote/controller.test.ts cloud/web/src/chat/BrowserLiveView.tsx cloud/web/src/chat/BrowserLiveView.test.tsx .github/workflows/pr248-round28-fix.yml .github/scripts/pr248_round28.py
          git commit -m "fix(browser): serialize restore attachment and input ordering"
          git push origin HEAD:claude/desktop-app-features-j8qfoj
