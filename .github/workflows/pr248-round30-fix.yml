name: PR248 round30 review fixes

on:
  push:
    branches:
      - claude/desktop-app-features-j8qfoj

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/desktop-app-features-j8qfoj
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply round 30 fixes
        run: python .github/scripts/pr248-round30-fix.py
      - name: Controller regressions
        run: npx vitest run src/browser/remote/controller.test.ts
      - name: Browser live-view regressions
        run: npm run test -w cascade-cloud-web -- BrowserLiveView.test.tsx
      - name: Full cloud web unit suite
        run: npm run test -w cascade-cloud-web
      - name: Cloud web production build
        run: npm run build -w cascade-cloud-web
      - name: Root unit suite
        run: npm test
      - name: TypeScript checks
        run: npm run lint
      - name: Commit fixes and remove helpers
        run: |
          rm .github/scripts/pr248-round30-fix.py .github/workflows/pr248-round30-fix.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(browser): bound takeover liveness and input intent"
          git push origin HEAD:claude/desktop-app-features-j8qfoj
