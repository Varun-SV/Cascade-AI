name: PR248 round26 review fixes

on:
  push:
    branches: [claude/desktop-app-features-j8qfoj]
    paths:
      - .github/workflows/pr248-round26-fix.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/desktop-app-features-j8qfoj
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply review fixes and regressions
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def one(text: str, old: str, new: str, label: str) -> str:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old, new, 1)

          # ── Controller: do not detach CDP in the middle of a human event. ──
          p = Path('src/browser/remote/controller.ts')
          s = p.read_text()
          start = s.index('  /** Nobody is watching any more: stop paying to render frames. */')
          end = s.index('\n  /**\n   * Suspend or resume the picture without giving up control.', start)
          stop_fn = '''  /** Nobody is watching any more: stop paying to render frames. */
          async stopWatching(runId: string): Promise<void> {
            const held = this.runs.get(runId);
            if (!held) return;
            await this.queueWatch(held, async () => {
              const cdp = held.screencast;
              // Invalidate the VIEW immediately. Anything that was accepted but
              // is still waiting in the human-action FIFO must fail its post-wait
              // identity check rather than land on a page the viewer has left.
              held.onFrame = undefined;
              if (!cdp) return;
              held.screencast = undefined;
              held.capturing = false;
              this.announceControl(runId);

              // Detaching is different from invalidating. A human click is three
              // CDP calls (move, press, release), all under the action slot. Do
              // not tear the session out from underneath that sequence. Queued
              // events see `screencast === undefined` above and refuse when they
              // reach the front; the one already landing is allowed to finish.
              const lease = this.leases.get(runId);
              const token = lease ? await lease.acquireActionSlot(null) : null;
              try {
                // Both best-effort and in this order: stop the stream first so no
                // further frames are produced, then let the session go. A run
                // whose page has already closed throws on both, and neither
                // failure is actionable.
                await cdp.send('Page.stopScreencast').catch(() => {});
                await cdp.detach().catch(() => {});
              } finally {
                if (token && lease) lease.endAction(token);
              }
            });
          }
          '''
          s = s[:start] + stop_fn.rstrip() + s[end:]

          # Show is a run-level privacy decision. If its old view was invalidated
          # while it waited, remember the decision so the next attach comes up
          # visible, even though no frames are flowing at this exact instant.
          s = one(
              s,
              '''      // SHOW re-reads the session; HIDE keeps the one it was aimed at.
                    const target = on ? held.screencast : cdp;
                    if (!target) return held.capturing === true;
                    const now = await this.applyCapture(runId, held, target, on);''',
              '''      // SHOW re-reads the session; HIDE keeps the one it was aimed at.
                    const target = on ? held.screencast : cdp;
                    if (!target) {
                      // Show ends a RUN-level privacy pause. An unwatch can
                      // invalidate the old session while this request waits for
                      // the action slot; remember the intent so the replacement
                      // watch attaches visible instead of resurrecting Hide.
                      if (on) {
                        held.hiddenByHolder = false;
                        if (lease.heldByHuman) lease.touch();
                      }
                      return held.capturing === true;
                    }
                    const now = await this.applyCapture(runId, held, target, on);''',
              'show intent across unwatch',
          )

          # Arm restore confirmation before the start command. Chrome may emit
          # the first frame before Page.startScreencast resolves.
          a = s.index('  private async applyCapture(')
          b = s.index('\n  /**\n   * Wait, briefly, for Chrome to produce a frame.', a)
          apply_fn = '''  private async applyCapture(
            runId: string,
            held: RunBrowser,
            cdp: CDPSession,
            on: boolean,
            confirmWithFrame = false,
          ): Promise<boolean> {
            if (held.capturing === on && !(on && confirmWithFrame && held.visibilityUnconfirmed)) return on;

            // Chrome is allowed to emit the first screencast frame BEFORE the
            // start command resolves. The frame handler has to know that frame
            // is the proof we are waiting for at the instant it arrives, not one
            // await later. Snapshot both fields so a failed start can put the
            // externally visible state back exactly where it was.
            const confirmRestore = on && confirmWithFrame;
            const wasUnconfirmed = held.visibilityUnconfirmed === true;
            const wasCapturing = held.capturing === true;
            if (confirmRestore) held.visibilityUnconfirmed = true;

            try {
              if (on) await cdp.send('Page.startScreencast', { ...SCREENCAST });
              else await cdp.send('Page.stopScreencast');
              if (on) {
                if (!confirmWithFrame) {
                  // A manual Show may return before Chrome paints. Keep the
                  // marker so a later agent action still insists on a frame.
                  held.visibilityUnconfirmed = true;
                  held.capturing = true;
                }
                // For a confirmed agent restore, do NOT write the marker here:
                // an early frame may already have cleared it and promoted
                // capturing. Re-arming it would discard that proof.
              } else {
                held.visibilityUnconfirmed = false;
                held.capturing = false;
              }
              // The decision, recorded separately from whether frames are flowing.
              held.hiddenByHolder = !on;
              this.announceControl(runId);
            } catch {
              if (confirmRestore) {
                // Failed restore means no agent action may proceed. A frame can
                // race the rejected command too, so roll back both fields rather
                // than leaving a transient promotion behind.
                held.visibilityUnconfirmed = wasUnconfirmed;
                held.capturing = wasCapturing;
                this.announceControl(runId);
                return false;
              }
              // The page went away underneath. Report what is actually true
              // rather than what was requested.
              return held.capturing === true && !held.visibilityUnconfirmed;
            }
            // For a confirmed restore `on` is true, so this means the start
            // command was accepted; the caller separately awaits the frame.
            return on;
          }
          '''
          s = s[:a] + apply_fn.rstrip() + s[b:]
          p.write_text(s)

          # ── Web: preserve local/remote event order and always expose handback. ──
          p = Path('cloud/web/src/chat/BrowserLiveView.tsx')
          s = p.read_text()
          marker = '''  /**
             * A paste, forwarded as the text it carries.'''
          helper = '''  /** Flush sampled wheel distance before a later discrete event. */
          const flushPendingScroll = () => {
            if (scrollTimerRef.current) {
              clearTimeout(scrollTimerRef.current);
              scrollTimerRef.current = null;
            }
            const total = pendingScrollRef.current;
            pendingScrollRef.current = null;
            if (!total) return;
            lastScrollRef.current = Date.now();
            onInput?.({ kind: 'scroll', ...total });
          };

          /**
           * The trailing pointer sample happened before the click/key/text that
           * is about to be sent. Flush it now so a timer cannot move the remote
           * pointer backwards after the later discrete event.
           */
          const flushPendingMove = () => {
            if (moveTimerRef.current) {
              clearTimeout(moveTimerRef.current);
              moveTimerRef.current = null;
            }
            const last = pendingMoveRef.current;
            pendingMoveRef.current = null;
            if (!last) return;
            lastMoveRef.current = Date.now();
            onInput?.({ kind: 'move', ...last });
          };

          '''
          if s.count(marker) != 1:
              raise SystemExit(f'flush helper marker: expected 1, got {s.count(marker)}')
          s = s.replace(marker, helper + marker, 1)

          s = one(
              s,
              '''    e.currentTarget instanceof HTMLTextAreaElement && (e.currentTarget.value = '');
                  onInput?.({ kind: 'text', text });''',
              '''    e.currentTarget instanceof HTMLTextAreaElement && (e.currentTarget.value = '');
                  flushPendingMove();
                  flushPendingScroll();
                  onInput?.({ kind: 'text', text });''',
              'paste ordering',
          )
          s = one(
              s,
              '''    // A command must not leave editable residue in the sink.
                  e.currentTarget.value = '';
                  onInput?.({ kind: 'key', key: e.key });''',
              '''    // A command must not leave editable residue in the sink.
                  e.currentTarget.value = '';
                  flushPendingMove();
                  flushPendingScroll();
                  onInput?.({ kind: 'key', key: e.key });''',
              'command ordering',
          )
          s = one(
              s,
              '''    e.currentTarget.value = '';
                  onInput?.({ kind: 'text', text });
                };

                const banner = driving''',
              '''    e.currentTarget.value = '';
                  flushPendingMove();
                  flushPendingScroll();
                  onInput?.({ kind: 'text', text });
                };

                const banner = driving''',
              'text ordering',
          )
          s = one(s, '        {takeable && (', '        {(driving || takeable) && (', 'handback availability')
          s = one(
              s,
              '''            const p = at(e.clientX, e.clientY);
                        if (p) onInput?.({ kind: 'click', ...p, button: e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left', clicks: e.detail || 1 });''',
              '''            const p = at(e.clientX, e.clientY);
                        if (p) {
                          // Samples generated before this click must be delivered
                          // before it, never later from their trailing timers.
                          flushPendingMove();
                          flushPendingScroll();
                          onInput?.({ kind: 'click', ...p, button: e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left', clicks: e.detail || 1 });
                        }''',
              'click ordering',
          )
          p.write_text(s)

          # ── Controller regressions. ──
          p = Path('src/browser/remote/controller.test.ts')
          s = p.read_text()

          # Existing stale-Hide test must now let the active click finish before
          # awaiting unwatch, because that is precisely the new safety contract.
          old = '''    // The panel remounts while it waits: session one goes, session two arrives.
              await c.stopWatching('run-A');
              const second: BrowserFrame[] = [];
              await c.startWatching('run-A', (f) => second.push(f));
              const two = cdpSessions[1]!;
              expect(two, 'genuinely a different session').not.toBe(one);

              gate.resolve();
              one.send = realSend;
              expect((await clicking).ok).toBe(true);
              expect(await hiding, 'the page they were looking at is gone, so this is not it').toBe(true);'''
          new = '''    // The panel remounts while it waits. Unwatch invalidates the
              // old view immediately, but must not detach its CDP session halfway
              // through the click already landing on it.
              const stopping = c.stopWatching('run-A');
              await new Promise((r) => setTimeout(r, 10));
              expect(one.detached, 'the active click still owns this CDP session').toBe(false);

              gate.resolve();
              one.send = realSend;
              expect((await clicking).ok).toBe(true);
              await hiding; // stale Hide is refused after the view invalidation.
              await stopping;
              expect(one.detached, 'and detach happens only after the click is complete').toBe(true);

              const second: BrowserFrame[] = [];
              await c.startWatching('run-A', (f) => second.push(f));
              const two = cdpSessions[1]!;
              expect(two, 'genuinely a different session').not.toBe(one);'''
          s = one(s, old, new, 'serialize unwatch regression')

          # Show remains a run-level intent even when the old watch disappears
          # while it is queued. Adapt the prior regression to the safer ordering.
          old = '''    // The panel remounts: the old session goes, a replacement attaches paused.
              await c.stopWatching('run-A');
              await c.startWatching('run-A', () => {});

              typing.resolve();
              first.send = realSend;
              await typed;

              expect(await showing, 'the page the person is looking at is shown').toBe(true);
              const replacement = cdpSessions.at(-1)!;
              expect(replacement, 'and it is not the session Show was aimed at').not.toBe(first);
              expect(replacement.sent, 'the picture came back on the current session')
                .toContain('Page.startScreencast');'''
          new = '''    // The panel remounts while Show is queued. Unwatch now waits for
              // the active input before detaching, so Show can reach the front
              // while there is deliberately no current session. Its run-level
              // intent must survive that gap and make the replacement visible.
              const stopping = c.stopWatching('run-A');
              await new Promise((r) => setTimeout(r, 10));

              typing.resolve();
              first.send = realSend;
              await typed;
              await showing; // no frame can flow until the replacement attaches.
              await stopping;
              await c.startWatching('run-A', () => {});

              const replacement = cdpSessions.at(-1)!;
              expect(replacement, 'and it is not the session Show was aimed at').not.toBe(first);
              expect(replacement.sent, 'the Show intent made the replacement visible')
                .toContain('Page.startScreencast');'''
          s = one(s, old, new, 'show intent regression')

          # Early-frame restore: the frame is emitted while startScreencast is
          # still pending. It must count as proof rather than being overwritten.
          needle = '''  it('acts as soon as the restored picture actually arrives', async () => {'''
          idx = s.index(needle)
          next_idx = s.index("\n  it('does not act on a page whose restore the user stopped'", idx)
          existing = s[idx:next_idx]
          early = '''

            it('counts a restored frame that arrives before startScreencast resolves', async () => {
              const { provider } = fakeProvider();
              const c = new RemoteBrowserController({ provider });
              await watched(c);
              c.actorEnded('w1');
              await c.takeOver('run-A');
              await c.setCapture('run-A', false);
              c.handBack('run-A');

              const states: Array<{ capturing: boolean }> = [];
              c.onControlFor('run-A', (state) => states.push({ capturing: state.capturing }));

              // Emit the keyframe synchronously, then keep the start command
              // unresolved. This is the ordering the old post-await marker lost.
              cdp.silentStart = true;
              const start = deferred();
              const realSend = cdp.send;
              cdp.send = async (method: string, params?: Record<string, unknown>) => {
                if (method === 'Page.startScreencast') {
                  const result = realSend.call(cdp, method, params);
                  cdp.pushFrame(77);
                  await start.promise;
                  return result;
                }
                return realSend.call(cdp, method, params);
              };

              const acting = c.controller({ kind: 'click', selector: '#after-early-frame' }, ctx('run-A', 'w2'));
              await new Promise((r) => setTimeout(r, 10));
              start.resolve();
              const out = await acting;
              cdp.send = realSend;

              expect(out.ok, 'the early keyframe satisfies the visibility gate').toBe(true);
              expect(page.calls).toContain('click:#after-early-frame');
              expect(states.at(-1)?.capturing, 'and the client is not left falsely paused').toBe(true);
            });'''
          s = s[:next_idx] + early + s[next_idx:]
          p.write_text(s)

          # ── Web regressions. ──
          p = Path('cloud/web/src/chat/BrowserLiveView.test.tsx')
          s = p.read_text()
          marker = '''  it('asks for the page rather than assuming it got it', () => {'''
          handback_test = '''  it('keeps Give it back available when the stream disappears', () => {
            const onHandBack = vi.fn();
            render(
              <BrowserLiveView
                active liveViewUrl={undefined} frame={undefined} streaming={false} human
                onStop={() => {}} onHandBack={onHandBack}
              />,
            );

            const button = screen.getByRole('button', { name: /give it back/i });
            fireEvent.click(button);
            expect(onHandBack).toHaveBeenCalledOnce();
            expect(screen.queryByRole('button', { name: /take control/i })).not.toBeInTheDocument();
          });

          '''
          if s.count(marker) != 1:
              raise SystemExit('handback test marker mismatch')
          s = s.replace(marker, handback_test + marker, 1)

          marker = '''  it('sums the wheel distance it did not send yet', async () => {'''
          wheel_test = '''  it('flushes pending wheel distance before a later click', async () => {
            vi.useFakeTimers();
            const now = vi.spyOn(Date, 'now');
            try {
              const onInput = vi.fn();
              render(
                <BrowserLiveView active liveViewUrl={undefined} frame={frame} human onStop={() => {}} onInput={onInput} />,
              );
              const img = screen.getByRole('img') as HTMLImageElement;
              Object.defineProperty(img, 'naturalWidth', { value: 1280 });
              Object.defineProperty(img, 'naturalHeight', { value: 800 });
              img.getBoundingClientRect = () => ({ left: 0, top: 0, width: 400, height: 400 }) as DOMRect;

              now.mockReturnValue(1_000);
              fireEvent.wheel(img, { clientX: 200, clientY: 200, deltaY: 10, deltaMode: 0 });
              onInput.mockClear();

              now.mockReturnValue(1_010);
              fireEvent.wheel(img, { clientX: 200, clientY: 200, deltaY: 20, deltaMode: 0 });
              expect(onInput, 'the second wheel sample is still pending').not.toHaveBeenCalled();

              fireEvent.mouseDown(img, { clientX: 200, clientY: 200, button: 0, detail: 1 });
              expect(onInput.mock.calls.map((c) => c[0])).toEqual([
                { kind: 'scroll', x: 0.5, y: 0.5, deltaY: 20 },
                { kind: 'click', x: 0.5, y: 0.5, button: 'left', clicks: 1 },
              ]);

              await act(async () => { vi.advanceTimersByTime(SCROLL_INTERVAL); });
              expect(onInput, 'the cleared timer does not replay the scroll after the click').toHaveBeenCalledTimes(2);
            } finally {
              now.mockRestore();
              vi.useRealTimers();
            }
          });

          '''
          if s.count(marker) != 1:
              raise SystemExit('wheel ordering test marker mismatch')
          s = s.replace(marker, wheel_test + marker, 1)
          p.write_text(s)
          PY

      - name: Controller regressions
        run: npx vitest run src/browser/remote/controller.test.ts
      - name: Full cloud web unit suite
        run: npm test -w cascade-cloud-web
      - name: Cloud web build
        run: npm run build -w cascade-cloud-web

      - name: Commit fixes and remove helper
        shell: bash
        run: |
          git rm .github/workflows/pr248-round26-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/browser/remote/controller.ts src/browser/remote/controller.test.ts cloud/web/src/chat/BrowserLiveView.tsx cloud/web/src/chat/BrowserLiveView.test.tsx
          git commit -m "fix(browser): close takeover ordering races"
          git push origin HEAD:claude/desktop-app-features-j8qfoj
