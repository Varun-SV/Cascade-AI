name: PR248 round33 review fixes

on:
  push:
    branches:
      - claude/desktop-app-features-j8qfoj
    paths:
      - .github/workflows/pr248-round33-fix.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/desktop-app-features-j8qfoj
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply round33 patch
        run: python .github/scripts/pr248-round33-fix.py
      - name: Controller regressions
        run: npm test -- --run src/browser/remote/controller.test.ts
      - name: BrowserLiveView regressions
        run: npm run test -w cascade-cloud-web -- src/chat/BrowserLiveView.test.tsx
      - name: Full cloud web suite
        run: npm run test -w cascade-cloud-web
      - name: Cloud web production build
        run: npm run build -w cascade-cloud-web
      - name: Full root suite
        run: npm test -- --run
      - name: TypeScript checks
        run: npm run lint
      - name: Commit fixes and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/scripts/pr248-round33-fix.py .github/workflows/pr248-round33-fix.yml
          git add src/browser/remote/controller.ts src/browser/remote/controller.test.ts cloud/web/src/chat/BrowserLiveView.tsx cloud/web/src/chat/BrowserLiveView.test.tsx
          git commit -m "fix(browser): bound lifecycle queues and preserve page identity"
          git push origin HEAD:claude/desktop-app-features-j8qfoj
