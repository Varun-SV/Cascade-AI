name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The situation you're in today and why it's painful — not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      multiple: true
      options: [CLI, Desktop app, Web (cascadeai.in), SDK, Orchestration/routing, Docs]
